<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación de Desempeño 180° · Etinar</title>
<style>
  :root{
    --amarillo:#F7C23B; --amarillo-osc:#E0A81E;
    --negro:#111111; --gris:#F4F4F5; --gris-borde:#E4E4E7;
    --texto-suave:#6B7280; --rojo:#DC2626; --verde:#16A34A; --azul:#2563EB;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{background:var(--gris);color:var(--negro);line-height:1.5}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .cuadro{width:30px;height:30px;background:var(--amarillo);border-radius:3px;flex-shrink:0}
  .logo .marca{font-weight:800;font-size:26px;letter-spacing:.06em}
  .oculto{display:none!important}
  a{color:var(--azul)}

  /* ---------- LOGIN ---------- */
  #vista-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:#fff;border:1px solid var(--gris-borde);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);width:100%;max-width:400px;padding:40px 34px;text-align:center}
  .login-card .logo{justify-content:center;margin-bottom:6px}
  .login-card h2{font-size:18px;margin:16px 0 4px}
  .login-card .sub{color:var(--texto-suave);font-size:13px;margin-bottom:26px}
  .campo{text-align:left;margin-bottom:14px}
  .campo label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#374151}
  .campo input,.campo select,.campo textarea{width:100%;padding:11px 13px;border:1px solid var(--gris-borde);border-radius:9px;font-size:14px;background:#fafafa;font-family:inherit}
  .campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--amarillo);background:#fff}
  .btn{background:var(--amarillo);color:var(--negro);font-weight:700;border:none;padding:11px 18px;border-radius:9px;font-size:14px;cursor:pointer}
  .btn:hover{background:var(--amarillo-osc)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn-full{width:100%;margin-top:6px}
  .btn-sec{background:#fff;border:1px solid var(--gris-borde);color:#374151;font-weight:600}
  .btn-sec:hover{background:var(--gris)}
  .btn-mini{padding:5px 10px;font-size:12px;border-radius:7px}
  .btn-peligro{background:#fff;border:1px solid #f3c2c2;color:var(--rojo)}
  .btn-peligro:hover{background:#fef2f2}
  .msg{font-size:13px;margin-top:14px;min-height:18px}
  .msg.error{color:var(--rojo)} .msg.ok{color:var(--verde)}

  /* ---------- APP ---------- */
  header.barra{background:var(--negro);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;flex-wrap:wrap;gap:10px}
  header.barra .logo .marca{color:#fff;font-size:20px}
  header.barra .usuario{display:flex;align-items:center;gap:12px;font-size:13px}
  .chip-rol{background:var(--amarillo);color:var(--negro);font-weight:700;font-size:11px;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .btn-salir{background:transparent;border:1px solid #444;color:#ddd;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
  .btn-salir:hover{border-color:#888;color:#fff}
  main{max-width:1040px;margin:0 auto;padding:24px 18px}

  .tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
  .tab{background:#fff;border:1px solid var(--gris-borde);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;color:#374151}
  .tab.activo{background:var(--negro);color:#fff;border-color:var(--negro)}

  .panel{background:#fff;border:1px solid var(--gris-borde);border-radius:14px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.04);margin-bottom:18px}
  .panel h1{font-size:19px;margin-bottom:4px}
  .panel h2{font-size:15px;margin:0 0 14px}
  .panel .desc{color:var(--texto-suave);font-size:13px;margin-bottom:18px}
  .fila{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .fila .campo{flex:1;min-width:150px;margin-bottom:0}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--gris-borde)}
  th{color:var(--texto-suave);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  tr:hover td{background:#fafafa}
  .estado{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .estado.pendiente{background:#FEF3C7;color:#92400E}
  .estado.completada{background:#DCFCE7;color:#166534}
  .vacio{color:var(--texto-suave);font-size:13px;padding:16px 0;text-align:center}

  /* formulario 180 */
  .categoria{background:var(--amarillo);color:var(--negro);font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;margin:20px 0 12px}
  .item{border-bottom:1px solid var(--gris-borde);padding:12px 0}
  .item p{font-size:14px;margin-bottom:9px}
  .escala{display:flex;gap:7px}
  .op{flex:1;text-align:center;border:1px solid var(--gris-borde);border-radius:8px;padding:8px 2px;font-size:11px;cursor:pointer;background:#fafafa;user-select:none}
  .op:hover{border-color:var(--amarillo)}
  .op.sel{background:var(--amarillo);border-color:var(--amarillo-osc);font-weight:700}
  .op b{display:block;font-size:15px}
  .resultado-cat{font-weight:700;margin:16px 0 6px;font-size:14px}
  .barra-prom{background:var(--gris);border-radius:20px;height:22px;overflow:hidden;position:relative;margin:4px 0}
  .barra-prom > div{background:var(--amarillo);height:100%}
  .barra-prom span{position:absolute;left:10px;top:0;line-height:22px;font-size:11px;font-weight:700}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<section id="vista-login">
  <div class="login-card">
    <div class="logo"><div class="cuadro"></div><div class="marca">ETINAR</div></div>
    <h2>Evaluación de Desempeño 180°</h2>
    <div class="sub">Ingresa con tus credenciales para continuar</div>
    <form id="form-login">
      <div class="campo"><label>Usuario</label>
        <input type="text" id="in-usuario" placeholder="admin" autocomplete="username" required></div>
      <div class="campo"><label>Contraseña</label>
        <input type="password" id="in-clave" placeholder="••••••••" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-full" id="btn-entrar">Ingresar</button>
      <div class="msg" id="msg-login"></div>
      <a href="#" id="link-olvido" style="display:inline-block;margin-top:10px;font-size:12px;color:var(--azul)">¿Olvidaste tu contraseña?</a>
    </form>
  </div>
</section>

<!-- ==================== APP ==================== -->
<section id="vista-app" class="oculto">
  <header class="barra">
    <div class="logo"><div class="cuadro"></div><div class="marca">ETINAR</div></div>
    <div class="usuario">
      <span id="nombre-usuario"></span>
      <span class="chip-rol" id="chip-rol"></span>
      <button class="btn-salir" id="btn-salir">Cerrar sesión</button>
    </div>
  </header>
  <main id="contenido"></main>
</section>

<!-- ==================== RESTABLECER CONTRASEÑA ==================== -->
<section id="vista-recovery" class="oculto">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
    <div class="login-card">
      <div class="logo" style="justify-content:center;margin-bottom:6px"><div class="cuadro"></div><div class="marca">ETINAR</div></div>
      <h2>Restablecer contraseña</h2>
      <div class="sub">Escribe tu nueva contraseña</div>
      <form id="form-recovery">
        <div class="campo"><label>Nueva contraseña</label><input type="password" id="rec-p1" required minlength="6"></div>
        <div class="campo"><label>Confirmar contraseña</label><input type="password" id="rec-p2" required minlength="6"></div>
        <button type="submit" class="btn btn-full">Guardar contraseña</button>
        <div class="msg" id="msg-recovery"></div>
      </form>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ==================== Config ====================
const SUPABASE_URL = "https://hwscyzrytwdvqlombpph.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3c2N5enJ5dHdkdnFsb21icHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjY4MTksImV4cCI6MjEwMDc0MjgxOX0.DK-K-HgqYPY8E8rpEE8OMBkknlZVmk-z85rZT4l2oe0";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// cliente temporal (para crear usuarios sin cerrar la sesión del admin)
const sbTmp = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false, autoRefreshToken:false }});

const DOMINIO = "etinar.app";
function usuarioAEmail(u){
  u=(u||"").trim().toLowerCase();
  if(u==="admin") return "comunicacion.organizacional@etinar.com";
  if(u.includes("@")) return u;
  return u+"@"+DOMINIO;
}
const $ = (id)=>document.getElementById(id);
const esc = (t)=>(t==null?"":String(t)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let PERFIL = null;

// ==================== Login ====================
$("form-login").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn=$("btn-entrar"), msg=$("msg-login");
  msg.className="msg"; msg.textContent="";
  btn.disabled=true; btn.textContent="Ingresando...";
  const email=usuarioAEmail($("in-usuario").value);
  const { error } = await sb.auth.signInWithPassword({ email, password:$("in-clave").value });
  if(error){
    msg.className="msg error"; msg.textContent="Usuario o contraseña incorrectos.";
    btn.disabled=false; btn.textContent="Ingresar"; return;
  }
  await iniciarSesion();
});

async function iniciarSesion(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ mostrarLogin(); return; }
  const { data: perfil } = await sb.from("perfiles").select("id,nombre,rol,usuario,departamento,puesto").eq("id",user.id).single();
  if(!perfil){
    $("msg-login").className="msg error";
    $("msg-login").textContent="Tu usuario no tiene perfil asignado. Contacta a RRHH.";
    await sb.auth.signOut();
    $("btn-entrar").disabled=false; $("btn-entrar").textContent="Ingresar"; return;
  }
  PERFIL=perfil;
  $("nombre-usuario").textContent=perfil.nombre||perfil.usuario;
  $("chip-rol").textContent=perfil.rol;
  $("vista-login").classList.add("oculto");
  $("vista-app").classList.remove("oculto");
  if(perfil.rol==="admin") renderAdmin(); else renderEvaluaciones();
}
function mostrarLogin(){
  $("vista-app").classList.add("oculto");
  $("vista-login").classList.remove("oculto");
  $("btn-entrar").disabled=false; $("btn-entrar").textContent="Ingresar";
  $("form-login").reset(); PERFIL=null;
}
$("btn-salir").addEventListener("click", async ()=>{ await sb.auth.signOut(); mostrarLogin(); });

// ==================== ADMIN ====================
function renderAdmin(){
  $("contenido").innerHTML = `
    <div class="tabs">
      <div class="tab activo" data-t="puestos">Puestos y competencias</div>
      <div class="tab" data-t="usuarios">Usuarios</div>
      <div class="tab" data-t="evaluaciones">Evaluaciones</div>
      <div class="tab" data-t="resultados">Resultados</div>
    </div>
    <div id="zona-tab"></div>`;
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("activo"));
    t.classList.add("activo");
    const k=t.dataset.t;
    if(k==="puestos") tabPuestos();
    else if(k==="usuarios") tabUsuarios();
    else if(k==="evaluaciones") tabEvaluaciones();
    else tabResultados();
  }));
  tabPuestos();
}

// ---- Tab Puestos y competencias ----
async function tabPuestos(){
  const z=$("zona-tab");
  z.innerHTML=`
    <div class="panel">
      <h1>Puestos y competencias</h1>
      <div class="desc">Cada puesto se evalúa con <b>4 competencias propias</b> + la <b>competencia transversal "Valores Etinar"</b> (común a todos). Crea el puesto y luego define sus competencias.</div>
      <form id="f-puesto" class="fila">
        <div class="campo"><label>Nombre del puesto</label><input id="p-nombre" required placeholder="Ej. Maestro de obra"></div>
        <div class="campo"><label>Departamento</label><input id="p-depto" placeholder="Ej. Operaciones"></div>
        <button class="btn" type="submit">Agregar puesto</button>
      </form>
    </div>
    <div id="zona-transversal"></div>
    <div class="panel"><h2>Puestos registrados</h2><div id="lista-puestos"><div class="vacio">Cargando...</div></div></div>
    <div id="zona-comp"></div>`;
  $("f-puesto").addEventListener("submit", async(e)=>{
    e.preventDefault();
    await sb.from("puestos").insert({ nombre:$("p-nombre").value.trim(), departamento:$("p-depto").value.trim() });
    e.target.reset(); cargarPuestos();
  });
  cargarTransversal();
  cargarPuestos();
}

// ---- Competencia transversal (Valores Etinar): puesto_id = null (aplica a todos) ----
async function cargarTransversal(){
  const { data } = await sb.from("competencias").select("*").is("puesto_id",null).order("orden");
  const items = data||[];
  const cont=$("zona-transversal");
  cont.innerHTML=`<div class="panel" style="border:2px solid var(--amarillo)">
    <h2>⭐ Competencia transversal — Valores Etinar</h2>
    <div class="desc">Estos ítems se evalúan en <b>TODOS los puestos</b> (además de las 4 competencias propias). Son los valores de la empresa: Calidad, Eficiencia, Confianza y Experiencia.</div>
    ${items.length? "" : `<button class="btn" id="b-seed-val" type="button">Cargar los 4 valores por defecto</button>`}
    <div id="lista-transv" style="margin-top:10px"></div>
    <form id="f-transv" class="fila" style="margin-top:14px">
      <div class="campo" style="flex:2"><label>Agregar otro ítem transversal</label><input id="t-texto" placeholder="Ej. Seguridad: cumple las normas de seguridad en obra."></div>
      <button class="btn btn-sec" type="submit">Agregar</button>
    </form>
  </div>`;
  const lista=$("lista-transv");
  lista.innerHTML = items.length
    ? items.map(c=>`<div class="item" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>${esc(c.texto)}</span><button class="btn btn-mini btn-peligro" data-delt="${c.id}">Eliminar</button></div>`).join("")
    : `<div class="vacio">Aún no has cargado los valores transversales.</div>`;
  lista.querySelectorAll("[data-delt]").forEach(b=>b.addEventListener("click",async()=>{ await sb.from("competencias").delete().eq("id",b.dataset.delt); cargarTransversal(); }));
  if($("b-seed-val")) $("b-seed-val").addEventListener("click",seedValores);
  $("f-transv").addEventListener("submit",async(e)=>{
    e.preventDefault(); const t=$("t-texto").value.trim(); if(!t) return;
    await sb.from("competencias").insert({puesto_id:null,categoria:"Valores Etinar",texto:t,orden:items.length+1});
    cargarTransversal();
  });
}
async function seedValores(){
  const vals=[
    "Calidad: realiza su trabajo con altos estándares de calidad, cuidando los detalles y evitando errores.",
    "Eficiencia: cumple sus tareas optimizando el tiempo y los recursos disponibles.",
    "Confianza: actúa con honestidad y responsabilidad, generando confianza en su equipo.",
    "Experiencia: aplica su conocimiento y experiencia para resolver situaciones y aportar valor."
  ];
  await sb.from("competencias").insert(vals.map((t,i)=>({puesto_id:null,categoria:"Valores Etinar",texto:t,orden:i+1})));
  cargarTransversal();
}
async function cargarPuestos(){
  const { data } = await sb.from("puestos").select("*").order("nombre");
  const cont=$("lista-puestos");
  if(!data||!data.length){ cont.innerHTML=`<div class="vacio">Aún no hay puestos.</div>`; return; }
  cont.innerHTML=`<table><thead><tr><th>Puesto</th><th>Departamento</th><th></th></tr></thead><tbody>${
    data.map(p=>`<tr><td><b>${esc(p.nombre)}</b></td><td>${esc(p.departamento)||"-"}</td>
      <td style="text-align:right"><button class="btn btn-mini btn-sec" data-comp="${p.id}" data-n="${esc(p.nombre)}">Competencias</button></td></tr>`).join("")
  }</tbody></table>`;
  cont.querySelectorAll("[data-comp]").forEach(b=>b.addEventListener("click",()=>gestionarComp(b.dataset.comp,b.dataset.n)));
}
async function gestionarComp(puestoId,nombre){
  const z=$("zona-comp");
  z.innerHTML=`<div class="panel">
    <h2>Competencias de: ${esc(nombre)}</h2>
    <form id="f-comp" class="fila">
      <div class="campo"><label>Categoría</label><input id="c-cat" required placeholder="Ej. Trabajo en equipo"></div>
      <div class="campo" style="flex:2"><label>Enunciado a evaluar</label><input id="c-texto" required placeholder="Ej. Colabora activamente con el equipo..."></div>
      <div class="campo" style="max-width:90px"><label>Orden</label><input id="c-orden" type="number" value="0"></div>
      <button class="btn" type="submit">Agregar</button>
    </form>
    <details open style="margin-top:16px;border:1px solid var(--gris-borde);border-radius:10px;padding:12px 14px">
      <summary style="cursor:pointer;font-weight:600;font-size:13px">📋 Importar competencias / subir documento (.txt o .csv)</summary>
      <div class="desc" style="margin-top:10px">Una competencia por línea con el formato <b>Categoría | Enunciado</b>. También puedes poner la categoría en una línea sola y debajo los enunciados. Acepta archivos .txt o .csv.</div>
      <input type="file" id="c-file" accept=".txt,.csv" style="margin-bottom:10px;font-size:13px">
      <textarea id="c-bulk" rows="7" style="width:100%;padding:11px 13px;border:1px solid var(--gris-borde);border-radius:9px;font-size:13px;font-family:inherit;background:#fafafa" placeholder="Trabajo en equipo | Colabora activamente con el equipo para cumplir los objetivos.&#10;Trabajo en equipo | Apoya a sus compañeros cuando se requiere cooperación.&#10;Comunicación | Comunica de forma clara las instrucciones técnicas."></textarea>
      <button class="btn" id="b-bulk" type="button" style="margin-top:10px">Importar competencias</button>
      <div class="msg" id="msg-bulk"></div>
    </details>
    <div id="lista-comp" style="margin-top:14px"></div>
  </div>`;
  z.scrollIntoView({behavior:"smooth"});
  $("f-comp").addEventListener("submit", async(e)=>{
    e.preventDefault();
    await sb.from("competencias").insert({ puesto_id:puestoId, categoria:$("c-cat").value.trim(), texto:$("c-texto").value.trim(), orden:parseInt($("c-orden").value)||0 });
    $("c-texto").value=""; cargarComp(puestoId);
  });
  $("c-file").addEventListener("change",(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ $("c-bulk").value = ($("c-bulk").value ? $("c-bulk").value+"\n" : "") + r.result; };
    r.readAsText(f);
  });
  $("b-bulk").addEventListener("click",()=>importarComp(puestoId));
  cargarComp(puestoId);
}

async function importarComp(puestoId){
  const msg=$("msg-bulk"); msg.className="msg";
  const lineas=$("c-bulk").value.split("\n");
  let cat="General"; const orden={}; const filas=[];
  lineas.forEach(l=>{
    l=l.trim(); if(!l) return;
    if(l.includes("|")){
      const i=l.indexOf("|");
      const c=l.slice(0,i).trim(); const t=l.slice(i+1).trim();
      if(c) cat=c;
      if(!t) return;
      orden[cat]=(orden[cat]||0)+1;
      filas.push({puesto_id:puestoId, categoria:cat, texto:t, orden:orden[cat]});
    } else {
      cat=l; // línea sola = encabezado de categoría
    }
  });
  if(!filas.length){ msg.className="msg error"; msg.textContent="No encontré competencias válidas. Usa el formato: Categoría | Enunciado"; return; }
  const btn=$("b-bulk"); btn.disabled=true; btn.textContent="Importando...";
  const { error } = await sb.from("competencias").insert(filas);
  if(error){ msg.className="msg error"; msg.textContent="Error: "+error.message; }
  else { msg.className="msg ok"; msg.textContent="✅ Se importaron "+filas.length+" competencias."; $("c-bulk").value=""; }
  btn.disabled=false; btn.textContent="Importar competencias";
  cargarComp(puestoId);
}
async function cargarComp(puestoId){
  const { data } = await sb.from("competencias").select("*").eq("puesto_id",puestoId).order("categoria").order("orden");
  const cont=$("lista-comp");
  if(!data||!data.length){ cont.innerHTML=`<div class="vacio">Sin competencias aún.</div>`; return; }
  let html=""; let cat=null;
  data.forEach(c=>{
    if(c.categoria!==cat){ cat=c.categoria; html+=`<div class="categoria">${esc(cat)}</div>`; }
    html+=`<div class="item" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span>${esc(c.texto)}</span>
      <button class="btn btn-mini btn-peligro" data-del="${c.id}">Eliminar</button></div>`;
  });
  cont.innerHTML=html;
  cont.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{
    await sb.from("competencias").delete().eq("id",b.dataset.del); cargarComp(puestoId);
  }));
}

// ---- Tab Usuarios ----

// ---- Generación de usuario y contraseña (alta individual) ----
let usuarioEditado=false;
function sugiereUsuario(nombre){
  const t=normTxt(nombre).split(/\s+/).map(soloAlnum).filter(Boolean);
  if(!t.length) return "usuario";
  let ap=""; if(t.length>=4) ap=t[2]; else if(t.length>=2) ap=t[1];
  const base=((t[0][0]||"")+(ap||t[0]));
  return base||t[0];
}
function genPassword(nombre){
  const n=soloAlnum((nombre||"").split(/\s+/)[0]);
  const cap=n?(n[0].toUpperCase()+n.slice(1)):"Etinar";
  return cap+"2026";
}
async function usuarioUnico(base){
  let u=base||"usuario", i=1;
  while(true){
    const { data } = await sb.from("perfiles").select("usuario").eq("usuario",u).maybeSingle();
    if(!data) return u;
    i++; u=base+i;
  }
}

// ---- Carga masiva de usuarios ----
let LISTA_MASIVA=[];
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
function normTxt(s){return (s==null?"":s.toString()).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function soloAlnum(s){return normTxt(s).replace(/[^a-z0-9]/g,'');}
function normCedula(c){ c=(c==null?"":c.toString()).replace(/\D/g,''); if(c.length===9) c='0'+c; return c; }
function mapFila(row){
  const o={};
  for(const k in row){
    const nk=normTxt(k);
    if(nk.startsWith('nombre')) o.nombres=row[k];
    else if(nk.startsWith('apellido')) o.apellidos=row[k];
    else if(nk.startsWith('cedula')||nk==='ci'||nk==='c.i') o.cedula=row[k];
    else if(nk.startsWith('depart')||nk.startsWith('area')) o.departamento=row[k];
    else if(nk.startsWith('puesto')||nk.startsWith('cargo')) o.puesto=row[k];
    else if(nk.startsWith('rol')) o.rol=row[k];
    else if(nk.startsWith('correo')||nk.startsWith('email')||nk.startsWith('mail')) o.correo=row[k];
    else if(nk.startsWith('usuario')) o.usuario=row[k];
  }
  return o;
}
function generarUsuario(nombres,apellidos,usados){
  const n=soloAlnum((nombres||'').split(/\s+/)[0]);
  const a=soloAlnum((apellidos||'').split(/\s+/)[0]);
  let base=((n[0]||'')+a) || soloAlnum(nombres)+soloAlnum(apellidos) || 'usuario';
  let u=base, i=1;
  while(usados.has(u)){ i++; u=base+i; }
  usados.add(u); return u;
}
function leerExcel(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=(e)=>{ try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(ws,{defval:"",raw:false}));
    }catch(err){rej(err);} };
    r.onerror=rej; r.readAsBinaryString(file);
  });
}
async function previewMasivo(){
  const cont=$("prev-masivo");
  const file=$("u-file").files[0];
  if(!file){ cont.innerHTML=`<div class="msg error">Primero elige un archivo.</div>`; return; }
  cont.innerHTML=`<div class="vacio">Leyendo archivo...</div>`;
  let filas;
  try{ filas=await leerExcel(file); }catch(err){ cont.innerHTML=`<div class="msg error">No pude leer el archivo: ${esc(err.message)}</div>`; return; }
  // usuarios ya existentes para no repetir
  const { data:existentes } = await sb.from("perfiles").select("usuario");
  const usados=new Set((existentes||[]).map(u=>u.usuario));
  LISTA_MASIVA=[];
  filas.forEach(row=>{
    const f=mapFila(row);
    const nombres=(f.nombres||"").toString().trim();
    const apellidos=(f.apellidos||"").toString().trim();
    if(!nombres && !apellidos) return; // fila vacía
    const cedula=normCedula(f.cedula);
    const usuario = f.usuario ? soloAlnum(f.usuario) : generarUsuario(nombres,apellidos,usados);
    if(f.usuario) usados.add(usuario);
    let rol=normTxt(f.rol); rol = rol.startsWith('evaluador')?'evaluador':'evaluado';
    LISTA_MASIVA.push({ usuario, cedula, nombre:(nombres+" "+apellidos).trim(),
      rol, correo:(f.correo||"").toString().trim(), departamento:(f.departamento||"").toString().trim(), puesto:(f.puesto||"").toString().trim() });
  });
  if(!LISTA_MASIVA.length){ cont.innerHTML=`<div class="msg error">No encontré filas válidas. Revisa que el Excel tenga las columnas Nombres, Apellidos, Cedula...</div>`; return; }
  const sinCed=LISTA_MASIVA.filter(r=>r.cedula.length<6).length;
  cont.innerHTML=`
    <div class="desc">Se van a crear <b>${LISTA_MASIVA.length}</b> usuarios. ${sinCed?`<span style="color:var(--rojo)">⚠️ ${sinCed} sin cédula válida (mín. 6 dígitos) — corrígelos en el Excel.</span>`:""}</div>
    <div style="max-height:300px;overflow:auto;border:1px solid var(--gris-borde);border-radius:9px">
    <table><thead><tr><th>Nombre</th><th>Usuario</th><th>Contraseña (cédula)</th><th>Rol</th><th>Puesto</th></tr></thead><tbody>${
      LISTA_MASIVA.slice(0,50).map(r=>`<tr><td>${esc(r.nombre)}</td><td><b>${esc(r.usuario)}</b></td><td>${esc(r.cedula)||'<span style="color:var(--rojo)">falta</span>'}</td><td>${esc(r.rol)}</td><td>${esc(r.puesto)||'-'}</td></tr>`).join("")
    }</tbody></table></div>
    ${LISTA_MASIVA.length>50?`<div class="desc" style="margin-top:6px">Mostrando los primeros 50 de ${LISTA_MASIVA.length}.</div>`:""}
    <button class="btn" id="b-crear-masivo" type="button" style="margin-top:12px">Crear los ${LISTA_MASIVA.length} usuarios</button>
    <div class="msg" id="msg-masivo"></div>`;
  $("b-crear-masivo").addEventListener("click", crearMasivo);
}
async function crearMasivo(){
  const btn=$("b-crear-masivo"), msg=$("msg-masivo");
  btn.disabled=true;
  let ok=0, saltados=0; const errores=[];
  for(let i=0;i<LISTA_MASIVA.length;i++){
    const r=LISTA_MASIVA[i];
    msg.className="msg"; msg.textContent=`Creando ${i+1} de ${LISTA_MASIVA.length}...  ✅ ${ok} creados`;
    if(r.cedula.length<6){ saltados++; errores.push(`${r.usuario}: cédula inválida`); continue; }
    const email=usuarioAEmail(r.usuario);
    const { data, error } = await sbTmp.auth.signUp({ email, password:r.cedula });
    if(error){
      if(/registered|exists|already/i.test(error.message)){ saltados++; }
      else if(/rate|too many/i.test(error.message)){ errores.push(`${r.usuario}: límite de Supabase, espera y reintenta`); await sleep(3000); }
      else { errores.push(`${r.usuario}: ${error.message}`); }
      await sleep(200); continue;
    }
    const { error:e2 } = await sb.from("perfiles").insert({ id:data.user.id, usuario:r.usuario, nombre:r.nombre, rol:r.rol, correo:r.correo||null, departamento:r.departamento, puesto:r.puesto||null });
    if(e2){ errores.push(`${r.usuario}: perfil ${e2.message}`); } else { ok++; await sb.from("accesos_temp").insert({ perfil_id:data.user.id, usuario:r.usuario, clave:r.cedula }); }
    await sleep(200);
  }
  msg.className="msg ok";
  msg.innerHTML=`✅ Listo. Creados: <b>${ok}</b>. Saltados (ya existían o sin cédula): <b>${saltados}</b>.${errores.length?` Con detalle: ${errores.length} avisos.`:""}`;
  if(errores.length){ msg.innerHTML+=`<div style="margin-top:8px;max-height:140px;overflow:auto;font-size:12px;color:var(--rojo)">${errores.slice(0,100).map(esc).join("<br>")}</div>`; }
  btn.disabled=false;
  cargarUsuarios();
}
async function crearUsuario(e){
  e.preventDefault();
  const btn=$("b-user"), msg=$("msg-user"), cred=$("cred-user");
  msg.className="msg"; msg.textContent=""; cred.innerHTML="";
  const nombre=$("u-nombre").value.trim();
  if(!nombre) return;
  btn.disabled=true; btn.textContent="Creando...";
  let usuario=soloAlnum($("u-usuario").value) || sugiereUsuario(nombre);
  usuario=await usuarioUnico(usuario);
  const password=genPassword(nombre);
  const email=usuarioAEmail(usuario);
  const { data, error } = await sbTmp.auth.signUp({ email, password });
  if(error){
    msg.className="msg error";
    msg.textContent = /registered|exists|already/i.test(error.message) ? "Ese usuario ya existe, intenta con otro nombre." : ("Error: "+error.message);
    btn.disabled=false; btn.textContent="Crear usuario"; return;
  }
  const correo=$("u-correo").value.trim()||null;
  const { error:e2 } = await sb.from("perfiles").insert({
    id:data.user.id, usuario, nombre, rol:$("u-rol").value, correo,
    departamento:$("u-depto").value||null, puesto:$("u-puesto").value||null
  });
  if(e2){ msg.className="msg error"; msg.textContent="Se creó el acceso pero falló el perfil: "+e2.message; btn.disabled=false; btn.textContent="Crear usuario"; return; }
  await sb.from("accesos_temp").insert({ perfil_id:data.user.id, usuario, clave:password });
  cred.innerHTML=`<div style="margin-top:14px;background:#FFF7E0;border:1px solid var(--amarillo);border-radius:10px;padding:14px;font-size:14px">
    ✅ <b>Usuario creado.</b> Copia estos datos y compártelos con la persona:<br><br>
    Usuario: <b style="font-size:16px">${esc(usuario)}</b><br>
    Contraseña: <b style="font-size:16px">${esc(password)}</b></div>`;
  $("f-user").reset(); usuarioEditado=false;
  btn.disabled=false; btn.textContent="Crear usuario";
  cargarUsuarios();
}
async function cargarUsuarios(){
  const { data } = await sb.from("perfiles").select("*").order("rol").order("nombre");
  const cont=$("lista-users");
  const otros=(data||[]).filter(u=>u.rol!=="admin");
  const rec=$("rec-user");
  if(rec) rec.innerHTML=`<option value="">—</option>`+otros.map(u=>`<option value="${u.id}">${esc(u.nombre)} (${esc(u.usuario)})</option>`).join("");
  if(!otros.length){ cont.innerHTML=`<div class="vacio">Aún no hay evaluadores ni evaluados.</div>`; return; }
  cont.innerHTML=`<table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Departamento</th><th>Puesto</th><th></th></tr></thead><tbody>${
    otros.map(u=>`<tr><td><b>${esc(u.nombre)}</b></td><td>${esc(u.usuario)}</td><td>${esc(u.rol)}</td><td>${esc(u.departamento)||"-"}</td><td>${esc(u.puesto)||"-"}</td>
      <td style="text-align:right"><button class="btn btn-mini btn-peligro" data-delu="${u.id}">Eliminar</button></td></tr>`).join("")
  }</tbody></table>`;
  cont.querySelectorAll("[data-delu]").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("¿Eliminar a este usuario? Se borrará su acceso y las evaluaciones asociadas. Esta acción no se puede deshacer.")) return;
    const { error } = await sb.from("perfiles").delete().eq("id",b.dataset.delu);
    if(error){ alert("No se pudo eliminar: "+error.message); return; }
    cargarUsuarios();
  }));
}

async function verComparativo(evaluadoId,nombre){
  const { data: evs } = await sb.from("evaluaciones")
    .select("id,tipo,codificacion,puesto:puestos!puesto_id(nombre),evaluador:perfiles!evaluador_id(nombre)")
    .eq("evaluado_id",evaluadoId).eq("estado","completada").order("id",{ascending:false});
  const evalJefe=(evs||[]).find(e=>e.tipo==="evaluador");
  const autoev=(evs||[]).find(e=>e.tipo==="autoevaluacion");
  async function respMap(evId){
    if(!evId) return {};
    const { data } = await sb.from("respuestas").select("puntaje,competencia:competencias!competencia_id(id,categoria,texto,orden)").eq("evaluacion_id",evId);
    const m={}; (data||[]).forEach(r=>{ if(r.competencia) m[r.competencia.id]={...r.competencia,puntaje:r.puntaje}; }); return m;
  }
  async function coment(evId){ if(!evId) return null; const {data}=await sb.from("comentarios").select("*").eq("evaluacion_id",evId).maybeSingle(); return data; }
  const mJefe=await respMap(evalJefe?.id), mAuto=await respMap(autoev?.id);
  const cJefe=await coment(evalJefe?.id), cAuto=await coment(autoev?.id);
  const comps={};
  Object.values(mAuto).forEach(c=>comps[c.id]={id:c.id,categoria:c.categoria,texto:c.texto,orden:c.orden});
  Object.values(mJefe).forEach(c=>comps[c.id]=comps[c.id]||{id:c.id,categoria:c.categoria,texto:c.texto,orden:c.orden});
  const lista=Object.values(comps).sort((a,b)=>String(a.categoria).localeCompare(String(b.categoria))||(a.orden-b.orden));
  const puesto=(evalJefe?.puesto?.nombre)||(autoev?.puesto?.nombre)||"";

  let html=`<div class="panel"><h2>Comparativo 180° — ${esc(nombre)} ${puesto?`· ${esc(puesto)}`:""}</h2>`;
  if(!evalJefe) html+=`<div class="desc" style="color:#92400E">⚠️ Aún no hay evaluación del jefe para esta persona.</div>`;
  if(!autoev) html+=`<div class="desc" style="color:#92400E">⚠️ Aún no hay autoevaluación de esta persona.</div>`;
  if(!lista.length){ html+=`<div class="vacio">Sin datos.</div></div>`; $("det-res").innerHTML=html; $("det-res").scrollIntoView({behavior:"smooth"}); return; }
  html+=`<table><thead><tr><th>Competencia</th><th style="text-align:center">Autoeval.</th><th style="text-align:center">Jefe</th><th style="text-align:center">Brecha</th></tr></thead><tbody>`;
  let cat=null, sA=0,nA=0,sJ=0,nJ=0;
  lista.forEach(c=>{
    if(c.categoria!==cat){ cat=c.categoria; html+=`<tr><td colspan="4" style="background:#fafafa;font-weight:700">${esc(cat)}</td></tr>`; }
    const a=mAuto[c.id]?.puntaje, j=mJefe[c.id]?.puntaje;
    if(a!=null){sA+=a;nA++;} if(j!=null){sJ+=j;nJ++;}
    const br=(a!=null&&j!=null)?(j-a):null;
    const col=br==null?'inherit':(br>0?'var(--verde)':(br<0?'var(--rojo)':'var(--texto-suave)'));
    html+=`<tr><td>${esc(c.texto)}</td>
      <td style="text-align:center">${a??'-'}</td>
      <td style="text-align:center">${j??'-'}</td>
      <td style="text-align:center;color:${col};font-weight:700">${br==null?'-':(br>0?'+'+br:br)}</td></tr>`;
  });
  const pA=nA?(sA/nA):0, pJ=nJ?(sJ/nJ):0;
  html+=`</tbody></table>
    <div class="categoria" style="margin-top:16px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap">
      <span>Prom. autoevaluación: ${pA.toFixed(2)}</span>
      <span>Prom. jefe: ${pJ.toFixed(2)}</span>
      <span>Brecha global: ${(pJ-pA>=0?'+':'')}${(pJ-pA).toFixed(2)}</span></div>
    <div class="desc" style="margin-top:8px">La <b>brecha</b> = puntaje del jefe menos la autoevaluación. En <span style="color:var(--verde)">verde</span>: el jefe califica más alto que la persona. En <span style="color:var(--rojo)">rojo</span>: la persona se calificó más alto que el jefe.</div>`;
  if(cJefe && (cJefe.fortalezas||cJefe.areas_mejora||cJefe.aspectos_mejorar_evaluador)){
    html+=`<div class="resultado-cat" style="margin-top:16px">Comentarios del jefe</div>`;
    if(cJefe.fortalezas) html+=`<p style="font-size:13px"><b>Fortalezas:</b> ${esc(cJefe.fortalezas)}</p>`;
    if(cJefe.areas_mejora) html+=`<p style="font-size:13px"><b>Áreas de mejora:</b> ${esc(cJefe.areas_mejora)}</p>`;
    if(cJefe.aspectos_mejorar_evaluador) html+=`<p style="font-size:13px"><b>Aspectos a mejorar del evaluador:</b> ${esc(cJefe.aspectos_mejorar_evaluador)}</p>`;
  }
  if(cAuto && (cAuto.fortalezas||cAuto.areas_mejora)){
    html+=`<div class="resultado-cat" style="margin-top:12px">Comentarios de la autoevaluación</div>`;
    if(cAuto.fortalezas) html+=`<p style="font-size:13px"><b>Fortalezas:</b> ${esc(cAuto.fortalezas)}</p>`;
    if(cAuto.areas_mejora) html+=`<p style="font-size:13px"><b>Áreas de mejora:</b> ${esc(cAuto.areas_mejora)}</p>`;
  }
  html+=`</div>`;
  $("det-res").innerHTML=html;
  $("det-res").scrollIntoView({behavior:"smooth"});
}

// ==================== EVALUADOR / EVALUADO ====================
async function renderEvaluaciones(){
  const campo = PERFIL.rol==="evaluado" ? "evaluado_id" : "evaluador_id";
  const { data } = await sb.from("evaluaciones")
    .select("id,tipo,estado,codificacion,fecha,evaluado:perfiles!evaluado_id(nombre),puesto:puestos!puesto_id(nombre,id)")
    .eq(campo,PERFIL.id).order("estado").order("id",{ascending:false});
  let html=`<div class="panel"><h1>Mis evaluaciones</h1>
    <div class="desc">${PERFIL.rol==="evaluado"?"Completa tu autoevaluación.":"Evalúa al personal asignado."}</div>`;
  if(!data||!data.length){ html+=`<div class="vacio">No tienes evaluaciones asignadas por ahora.</div></div>`; $("contenido").innerHTML=html; return; }
  html+=`<table><thead><tr><th>Cód.</th><th>${PERFIL.rol==="evaluado"?"Puesto":"Evaluado"}</th><th>Tipo</th><th>Estado</th><th></th></tr></thead><tbody>${
    data.map(e=>`<tr><td>${esc(e.codificacion)||"-"}</td>
      <td><b>${PERFIL.rol==="evaluado"?esc(e.puesto?.nombre):esc(e.evaluado?.nombre)}</b></td>
      <td>${e.tipo==="autoevaluacion"?"Autoeval.":"Evaluación"}</td>
      <td><span class="estado ${e.estado}">${e.estado}</span></td>
      <td style="text-align:right"><button class="btn btn-mini ${e.estado==="completada"?"btn-sec":""}" data-ll="${e.id}">${e.estado==="completada"?"Ver":"Llenar"}</button></td></tr>`).join("")
  }</tbody></table></div>`;
  $("contenido").innerHTML=html;
  document.querySelectorAll("[data-ll]").forEach(b=>b.addEventListener("click",()=>abrirFormulario(b.dataset.ll)));
}
async function abrirFormulario(evalId){
  const { data:ev } = await sb.from("evaluaciones").select("*,evaluado:perfiles!evaluado_id(nombre),puesto:puestos!puesto_id(nombre,id)").eq("id",evalId).single();
  let { data:comps } = await sb.from("competencias").select("*").or(`puesto_id.eq.${ev.puesto_id},puesto_id.is.null`);
  comps = (comps||[]).sort((a,b)=> (a.puesto_id?0:1)-(b.puesto_id?0:1) || String(a.categoria).localeCompare(String(b.categoria)) || (a.orden-b.orden));
  const { data:prev } = await sb.from("respuestas").select("competencia_id,puntaje").eq("evaluacion_id",evalId);
  const { data:comPrev } = await sb.from("comentarios").select("*").eq("evaluacion_id",evalId).maybeSingle();
  const yaResp={}; (prev||[]).forEach(r=>yaResp[r.competencia_id]=r.puntaje);
  const soloLectura = ev.estado==="completada";
  const NIV=["Deficiente","Regular","Bueno","Muy bueno","Excelente"];

  let html=`<div class="panel">
    <button class="btn btn-mini btn-sec" id="volver">← Volver</button>
    <h1 style="margin-top:12px">Evaluación 180° — ${esc(ev.evaluado?.nombre)}</h1>
    <div class="desc">Puesto: ${esc(ev.puesto?.nombre)||"-"} · Codificación: ${esc(ev.codificacion)||"-"}</div>`;
  if(!comps||!comps.length){
    html+=`<div class="vacio">Este puesto todavía no tiene competencias configuradas. Avisa a RRHH.</div></div>`;
    $("contenido").innerHTML=html; $("volver").addEventListener("click",renderEvaluaciones); return;
  }
  let cat=null;
  comps.forEach(c=>{
    if(c.categoria!==cat){ cat=c.categoria; html+=`<div class="categoria">${esc(cat)}</div>`; }
    html+=`<div class="item"><p>${esc(c.texto)}</p><div class="escala" data-comp="${c.id}">${
      NIV.map((nv,i)=>{const v=i+1;return `<div class="op ${yaResp[c.id]===v?"sel":""}" data-v="${v}">${'<b>'+v+'</b>'}${nv}</div>`;}).join("")
    }</div></div>`;
  });
  html+=`<div class="categoria">Comentarios</div>
    <div class="campo"><label>Fortalezas</label><textarea id="cm-fort" rows="2">${esc(comPrev?.fortalezas)}</textarea></div>
    <div class="campo"><label>Áreas de mejora</label><textarea id="cm-area" rows="2">${esc(comPrev?.areas_mejora)}</textarea></div>`;
  if(ev.tipo!=="autoevaluacion")
    html+=`<div class="campo"><label>Aspectos a mejorar del evaluador</label><textarea id="cm-evalr" rows="2">${esc(comPrev?.aspectos_mejorar_evaluador)}</textarea></div>`;
  if(!soloLectura) html+=`<button class="btn btn-full" id="b-guardar" style="margin-top:16px">Guardar y enviar evaluación</button>`;
  html+=`<div class="msg" id="msg-form"></div></div>`;
  $("contenido").innerHTML=html;
  $("volver").addEventListener("click",renderEvaluaciones);

  if(soloLectura){
    document.querySelectorAll(".op").forEach(o=>o.style.cursor="default");
    document.querySelectorAll("textarea").forEach(t=>t.disabled=true);
    return;
  }
  document.querySelectorAll(".escala").forEach(esc2=>{
    esc2.querySelectorAll(".op").forEach(op=>op.addEventListener("click",()=>{
      esc2.querySelectorAll(".op").forEach(x=>x.classList.remove("sel"));
      op.classList.add("sel");
    }));
  });
  $("b-guardar").addEventListener("click",()=>guardarFormulario(evalId,ev.tipo));
}
async function guardarFormulario(evalId,tipo){
  const msg=$("msg-form"); msg.className="msg";
  const filas=[]; let faltan=false;
  document.querySelectorAll(".escala").forEach(e=>{
    const sel=e.querySelector(".op.sel");
    if(!sel){ faltan=true; return; }
    filas.push({ evaluacion_id:Number(evalId), competencia_id:Number(e.dataset.comp), puntaje:Number(sel.dataset.v) });
  });
  if(faltan){ msg.className="msg error"; msg.textContent="Por favor califica todas las competencias antes de enviar."; return; }
  const btn=$("b-guardar"); btn.disabled=true; btn.textContent="Guardando...";
  const { error:e1 } = await sb.from("respuestas").upsert(filas,{onConflict:"evaluacion_id,competencia_id"});
  const com={ evaluacion_id:Number(evalId), fortalezas:$("cm-fort").value.trim(), areas_mejora:$("cm-area").value.trim(),
    aspectos_mejorar_evaluador: tipo!=="autoevaluacion" ? ($("cm-evalr")?.value.trim()||null) : null };
  const { error:e2 } = await sb.from("comentarios").upsert(com,{onConflict:"evaluacion_id"});
  const { error:e3 } = await sb.from("evaluaciones").update({estado:"completada"}).eq("id",evalId);
  if(e1||e2||e3){ msg.className="msg error"; msg.textContent="Error al guardar: "+((e1||e2||e3).message); btn.disabled=false; btn.textContent="Guardar y enviar evaluación"; return; }
  msg.className="msg ok"; msg.textContent="✅ Evaluación enviada. ¡Gracias!";
  setTimeout(renderEvaluaciones,1200);
}

// ==================== Recuperación de contraseña ====================
$("link-olvido").addEventListener("click", async (e)=>{
  e.preventDefault();
  const msg=$("msg-login"); msg.className="msg";
  const escrito=$("in-usuario").value.trim();
  const u=(escrito || prompt("Escribe tu usuario o correo (el admin usa el correo corporativo):") || "").trim();
  if(!u) return;
  const email = u.includes("@") ? u : usuarioAEmail(u);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
  if(error){ msg.className="msg error"; msg.textContent="No se pudo enviar: "+error.message; }
  else { msg.className="msg ok"; msg.textContent="Te enviamos un enlace a tu correo para restablecer la contraseña. Revisa tu bandeja (y spam)."; }
});
function mostrarRecovery(){
  $("vista-login").classList.add("oculto"); $("vista-app").classList.add("oculto");
  $("vista-recovery").classList.remove("oculto");
}
$("form-recovery").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const p1=$("rec-p1").value, p2=$("rec-p2").value, msg=$("msg-recovery"); msg.className="msg";
  if(p1.length<6){ msg.className="msg error"; msg.textContent="Mínimo 6 caracteres."; return; }
  if(p1!==p2){ msg.className="msg error"; msg.textContent="Las contraseñas no coinciden."; return; }
  const { error } = await sb.auth.updateUser({ password:p1 });
  if(error){ msg.className="msg error"; msg.textContent="Error: "+error.message; return; }
  msg.className="msg ok"; msg.textContent="✅ Contraseña actualizada. Redirigiendo al inicio...";
  setTimeout(async ()=>{ await sb.auth.signOut(); window.location.hash=""; mostrarLogin(); }, 1600);
});
sb.auth.onAuthStateChange((event)=>{ if(event==="PASSWORD_RECOVERY") mostrarRecovery(); });

// ==================== Inicio ====================
(async()=>{
  if(window.location.hash.includes("type=recovery")){ mostrarRecovery(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await iniciarSesion(); else mostrarLogin();
})();
</script>
