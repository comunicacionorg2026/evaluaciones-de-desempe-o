// ==================== ANALÍTICA ====================
VISTAS.analitica = async (arg)=>{
  arg=arg||{};
  const hechas=await traerTodo(()=>sb.from("evaluaciones").select("id,periodo_id").eq("estado","completada"));
  const conDatos=new Set(hechas.map(e=>e.periodo_id));
  const pid=arg.pid||periodoDefecto(conDatos);
  if(!pid){ $("contenido").innerHTML=encabezado("Analítica","")+`<div class="card"><div class="vacio">Aún no hay campañas.</div></div>`; return; }
  const todas=(await analizarPeriodo(pid)).filter(x=>x.prom180!=null);
  const deps=[...new Set(todas.map(x=>x.departamento))].sort(), pues=[...new Set(todas.map(x=>x.puesto))].sort();
  const dep=arg.dep||"", pue=arg.pue||"";
  const P=todas.filter(x=>(!dep||x.departamento===dep)&&(!pue||x.puesto===pue));
  const dist=[0,0,0,0,0]; P.forEach(x=>dist[nivelIdx(x.prom180)]++);
  // evolución: promedio por campaña (con los mismos filtros)
  const evol=[]; for(const per of D.periodos.slice().reverse().filter(p=>conDatos.has(p.id))){ const l=(per.id===Number(pid)?todas:(await analizarPeriodo(per.id))).filter(x=>x.prom180!=null&&(!dep||x.departamento===dep)&&(!pue||x.puesto===pue)); const v=prom(l.map(x=>x.prom180)); if(v!=null) evol.push({t:per.nombre,v}); }
  // brecha por competencia (% con brecha ≥ significativa) y mapa de calor competencia × departamento
  const comp={}; P.forEach(x=>x.filas.forEach(f=>{ if(f.bd==null) return; const k=f.c.categoria; const o=comp[k]=comp[k]||{k,n:0,s:0,b:[],dep:{}}; o.n++; o.b.push(Math.max(0,f.bd)); if(f.nb.i>=2) o.s++; const d=o.dep[x.departamento]=o.dep[x.departamento]||{n:0,s:0}; d.n++; if(f.nb.i>=2) d.s++; }));
  const compL=Object.values(comp).map(o=>({...o,pct:Math.round(o.s*100/o.n),prom:prom(o.b)})).sort((a,b)=>b.pct-a.pct);
  const depsV=[...new Set(P.map(x=>x.departamento))].sort();
  // calibración
  const cal=[]; const promGral=prom(P.map(x=>x.promJ));
  const porJefe={}; P.forEach(x=>{ if(x.promJ!=null&&x.jefeHecha){ (porJefe[x.jefeHecha.evaluador_id]=porJefe[x.jefeHecha.evaluador_id]||[]).push(x); } });
  Object.entries(porJefe).forEach(([jid,l])=>{ if(l.length<3) return; const pj=prom(l.map(x=>x.promJ)); const resto=P.filter(x=>x.promJ!=null&&!l.includes(x)); const pr=prom(resto.map(x=>x.promJ)); if(pr==null) return;
    const exc=l.filter(x=>x.promJ>=4.5).length;
    if(pj-pr>=0.5) cal.push({k:"a",mot:"Equipo con notas infladas",quien:perfil(jid)?.nombre+" (jefe)",area:l[0].departamento,det:`Promedio de su equipo ${pj.toFixed(2)} · resto de la empresa ${pr.toFixed(2)} · ${Math.round(exc*100/l.length)}% Excelente`});
    else if(pr-pj>=0.5) cal.push({k:"c",mot:"Equipo con notas severas",quien:perfil(jid)?.nombre+" (jefe)",area:l[0].departamento,det:`Promedio de su equipo ${pj.toFixed(2)} · resto de la empresa ${pr.toFixed(2)}`}); });
  P.forEach(x=>{ if(x.brechaAuto!=null&&Math.abs(x.brechaAuto)>=1) cal.push({k:"b",mot:"Brecha alta",quien:x.nombre,area:x.departamento,det:`Autoevaluación ${f2(x.promA)} vs. jefe ${f2(x.promJ)} (brecha ${signo(x.brechaAuto)})`,x}); });
  const porDep={}; P.forEach(x=>(porDep[x.departamento]=porDep[x.departamento]||[]).push(x));
  Object.values(porDep).forEach(l=>{ if(l.length<3) return; const pd=prom(l.map(x=>x.prom180)); l.forEach(x=>{ if(Math.abs(x.prom180-pd)>=1) cal.push({k:"c",mot:"Fuera del promedio",quien:x.nombre,area:x.departamento,det:`Resultado ${f2(x.prom180)} · promedio del área ${pd.toFixed(2)}`,x}); }); });
  $("contenido").innerHTML=`<div>
    ${encabezado("Analítica — Curva de desempeño","Distribución, evolución, mapa de brechas y calibración",`<button class="btn ghost sm" id="an-xls">Exportar Excel</button>`)}
    <div class="card"><div class="fila">
      <div class="campo"><label for="an-per">Campaña</label>${selPeriodoHTML("an-per",pid)}</div>
      <div class="campo"><label for="an-dep">Departamento</label><select class="inp" id="an-dep">${opciones(deps,dep,"Todos")}</select></div>
      <div class="campo"><label for="an-pue">Puesto</label><select class="inp" id="an-pue">${opciones(pues,pue,"Todos")}</select></div>
    </div><div class="cap" style="margin:10px 0 0">${P.length} personas con resultado. Los gráficos se recalculan con los filtros.</div></div>
    <div class="row2 eq">
      <div class="card"><h3>Distribución del desempeño</h3><div class="cap">Cuántas personas caen en cada nivel</div>${curvaSVG(dist)}</div>
      <div class="card"><h3>Evolución en el tiempo</h3><div class="cap">Resultado promedio por campaña</div>${tendenciaSVG(evol)}</div>
    </div>
    <div class="card mt"><h3>Personas por nivel</h3><div class="cap">Elige un nivel para ver quiénes están en esa categoría y abrir su informe</div>
      <div class="chips" id="an-chips">${NIVELES.map((n,i)=>`<button class="chip" data-niv="${i}"><span class="dot" style="background:${n.color}"></span>${n.txt} · ${dist[i]}</button>`).join("")}</div><div id="an-niv" style="margin-top:12px"></div></div>
    <div class="card mt"><h3>Brecha por competencia</h3><div class="cap">% de personas con brecha ≥ ${CFG.brecha_significativa.toFixed(2)} (dice más que el promedio)</div>
        ${compL.length?compL.slice(0,15).map(o=>`<div class="prog"><div class="name" title="${esc(o.k)}">${esc(o.k)}</div><div class="track"><div style="width:${o.pct}%;background:${o.pct>=35?"#DC2626":o.pct>=15?"#B45309":"#15803D"}"></div></div><div class="pct">${o.pct}% <span class="sub-t">${o.s}/${o.n}</span></div></div>`).join(""):`<div class="vacio">Sin datos.</div>`}</div>
    <div class="card mt"><h3>Mapa de calor</h3><div class="cap">Competencia × departamento · % de personas con brecha significativa o crítica</div>
        ${compL.length?`<div class="tabla-wrap"><table class="heat"><thead><tr><th>Competencia</th>${depsV.map(d=>`<th class="c">${esc(d)}</th>`).join("")}</tr></thead><tbody>${compL.slice(0,15).map(o=>`<tr><td style="font-size:12.5px;min-width:150px">${esc(o.k)}</td>${depsV.map(d=>{ const c=o.dep[d]; const p=c?Math.round(c.s*100/c.n):null; return `<td class="hc" style="${colorCalor(p)}" title="${c?c.s+" de "+c.n:"sin datos"}">${p==null?"—":p+"%"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="vacio">Sin datos.</div>`}</div>
    <div class="card mt"><h3>Casos para revisar (calibración)</h3><div class="cap">Personas o jefes cuyas notas conviene revisar en una reunión de calibración antes de cerrar la campaña</div>
      ${cal.length?`<div class="tabla-wrap"><table><thead><tr><th>Motivo</th><th>Quién</th><th>Área</th><th>Detalle</th><th></th></tr></thead><tbody>${cal.map((c,i)=>`<tr><td><span class="badge ${c.k==="a"?"b-wait":c.k==="b"?"b-red":"b-blue"}">${c.mot}</span></td><td><b>${esc(c.quien)}</b></td><td>${esc(c.area)}</td><td class="sub-t" style="font-size:12.5px">${esc(c.det)}</td><td class="r">${c.x?`<button class="btn ghost xs" data-cal="${i}">Ver informe</button>`:""}</td></tr>`).join("")}</tbody></table></div>`:`<div class="vacio">No hay casos que requieran calibración con estos filtros.</div>`}
      <div class="explbox"><b>Qué significa cada motivo:</b> <b>Notas infladas / severas</b>: el promedio del equipo de un jefe (3+ personas) se aleja 0.50 o más del resto de la empresa. <b>Brecha alta</b>: la autoevaluación y el jefe difieren 1.00 o más. <b>Fuera del promedio</b>: el resultado se aleja 1.00 o más del promedio de su área. No significa que la nota esté mal; justifica revisarla con evidencias.</div>
    </div></div>`;
  const re=()=>irA("analitica",{pid:$("an-per").value,dep:$("an-dep").value,pue:$("an-pue").value});
  $("an-per").onchange=()=>irA("analitica",{pid:$("an-per").value}); $("an-dep").onchange=re; $("an-pue").onchange=re;
  const verNiv=(i)=>{ document.querySelectorAll("[data-niv]").forEach(b=>b.classList.toggle("on",Number(b.dataset.niv)===i));
    const l=P.filter(x=>nivelIdx(x.prom180)===i).sort((a,b)=>a.prom180-b.prom180);
    $("an-niv").innerHTML=l.length?`<div class="tabla-wrap"><table><thead><tr><th>Nombre</th><th>Puesto</th><th>Departamento</th><th class="c">Resultado</th><th>Clasificación</th><th></th></tr></thead><tbody>${l.slice(0,300).map(x=>`<tr><td><b>${esc(x.nombre)}</b></td><td>${esc(x.puesto)}</td><td>${esc(x.departamento)}</td><td class="c num">${f2(x.prom180)}</td><td><span class="badge ${x.clasif.cls}">${x.clasif.txt}</span></td><td class="r"><button class="btn ghost xs" data-anx="${x.id}">Ver informe</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="vacio">Nadie en este nivel.</div>`;
    document.querySelectorAll("[data-anx]").forEach(b=>b.onclick=()=>verInforme(P.find(x=>x.id===b.dataset.anx),"analitica")); };
  document.querySelectorAll("[data-niv]").forEach(b=>b.onclick=()=>verNiv(Number(b.dataset.niv)));
  verNiv(dist.indexOf(Math.max(...dist)));
  document.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>verInforme(cal[Number(b.dataset.cal)].x,"analitica"));
  $("an-xls").onclick=()=>exportarExcel("Analitica_Etinar",[
    {nombre:"Brecha por competencia",filas:compL.map(o=>({Competencia:o.k,"Personas evaluadas":o.n,"Con brecha ≥ significativa":o.s,"%":o.pct,"Brecha promedio":+(o.prom||0).toFixed(2)}))},
    {nombre:"Mapa de calor",filas:compL.map(o=>Object.assign({Competencia:o.k},...depsV.map(d=>({[d]:o.dep[d]?Math.round(o.dep[d].s*100/o.dep[d].n)+"%":""}))))},
    {nombre:"Personas por nivel",filas:P.map(x=>({Nombre:x.nombre,Puesto:x.puesto,Departamento:x.departamento,Resultado:+x.prom180.toFixed(2),Nivel:x.nivel.txt,Clasificación:x.clasif.txt}))},
    {nombre:"Calibración",filas:cal.map(c=>({Motivo:c.mot,Quién:c.quien,Área:c.area,Detalle:c.det}))},
    {nombre:"Evolución",filas:evol.map(e=>({Campaña:e.t,"Resultado promedio":+e.v.toFixed(2)}))}]);
};

  const per=D.periodos.find(p=>p.id===Number(pid))||{};
  abrirModal(`<h3>Carga masiva de resultados</h3><div style="color:var(--muted);font-size:12.5px;margin:4px 0 12px">${esc(per.nombre||"")}. Para evaluaciones hechas en papel o en otro sistema. Descarga la plantilla de la campaña: trae una fila por persona, tipo de evaluación y competencia. Llena <b>Puntaje (1-5)</b> y, si aplica, <b>Resultado real</b>; luego súbela. Las evaluaciones con todas sus competencias calificadas quedan como completadas.</div>
    ${per.estado==="cerrado"?`<div class="aviso amber">La campaña está cerrada. Puedes cargar resultados como RRHH; quedará registrado en la bitácora.</div>`:""}
    <div class="fila"><div class="campo"><label for="cr-sol">La plantilla incluye</label><select class="inp" id="cr-sol">${opciones([["pend","Solo evaluaciones pendientes"],["todas","Todas (también las completadas)"]],"pend")}</select></div>
      <div class="campo"><label for="cr-tipo">Tipo</label><select class="inp" id="cr-tipo">${opciones([["","Jefe y autoevaluación"],["evaluador","Solo valoración del jefe"],["autoevaluacion","Solo autoevaluación"]],"")}</select></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px"><button class="btn ghost sm" id="cr-pl">Descargar plantilla</button><input type="file" id="cr-f" accept=".xlsx,.xls,.csv" style="font-size:13px"></div>
    <div id="cr-out" style="margin-top:12px"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn ghost sm" data-cerrar>Cerrar</button></div>`, m=>{
    m.querySelector("#cr-pl").onclick=async()=>{
      const evs=(await cargarEvaluaciones(pid)).filter(e=>(m.querySelector("#cr-sol").value==="todas"||e.estado!=="completada")&&(!m.querySelector("#cr-tipo").value||e.tipo===m.querySelector("#cr-tipo").value));
      const resps=await cargarRespuestas(evs.map(e=>e.id)); const ya={}; resps.forEach(r=>ya[r.evaluacion_id+"|"+r.competencia_id]=r);
      const filas=[]; evs.sort((a,b)=>String(perfil(a.evaluado_id)?.nombre).localeCompare(String(perfil(b.evaluado_id)?.nombre))||a.tipo.localeCompare(b.tipo)).forEach(e=>{ const p=perfil(e.evaluado_id)||{};
        compsDelPuesto(e.puesto_id).forEach(c=>{ const r=ya[e.id+"|"+c.id]; filas.push({"ID evaluación":e.id,"ID competencia":c.id,Cédula:p.cedula||"",Colaborador:p.nombre||"",Puesto:D.puestoPorId[e.puesto_id]?.nombre||"",
          Tipo:e.tipo==="autoevaluacion"?"Autoevaluación":"Valoración del jefe",Evaluador:e.tipo==="autoevaluacion"?"":perfil(e.evaluador_id)?.nombre||"",Competencia:c.categoria,Conducta:c.texto,Indicador:c.indicador||"",Meta:c.meta||"","Nivel esperado":esperadoDe(c),
          "Puntaje (1-5)":r?.puntaje??"","Resultado real":r?.evidencia||"",...(e.tipo!=="autoevaluacion"&&modoKPI()?{"Justificación (si el puntaje se aparta del KPI)":r?.justificacion||""}:{})}); }); });
      if(!filas.length){ m.querySelector("#cr-out").innerHTML=`<div class="aviso">No hay evaluaciones con ese filtro. Genera primero la campaña en Evaluaciones.</div>`; return; }
      exportarExcel("Plantilla_Resultados_"+soloAlnum(per.nombre||"campana"),[{nombre:"Resultados",filas}]);

      const evs=await cargarEvaluaciones(pid); const porId=Object.fromEntries(evs.map(x=>[x.id,x]));
      const ok=[], errores=[];
      let calc=0, desv=0;
      filas.forEach((r,i)=>{ const eid=parseInt(col(r,"id evaluacion")), cid=parseInt(col(r,"id competencia")), ev=col(r,"resultado real"), just=col(r,"justificacion"); let pt=col(r,"puntaje");
        const e2=porId[eid], c2=e2&&compsDelPuesto(e2.puesto_id).find(c=>c.id===cid);
        // Valoración del jefe: el resultado real del KPI se convierte en nota (vacío → se calcula; modo obligatorio → manda el KPI)
        const k=e2&&c2&&e2.tipo!=="autoevaluacion"&&modoKPI()?notaKPI(c2.meta,ev):null;
        if(k&&(pt===""||modoKPI()===2)){ if(pt==="") calc++; pt=String(k.nota); }
        if(pt==="") return;
        const v=parseInt(pt);
        if(!e2){ errores.push(`Fila ${i+2}: la evaluación ${eid||"(vacía)"} no pertenece a esta campaña`); return; }
        if(!compsDelPuesto(e2.puesto_id).some(c=>c.id===cid)){ errores.push(`Fila ${i+2}: competencia no válida para el puesto`); return; }
        if(!(v>=1&&v<=5)||String(v)!==pt.replace(/\.0+$/,"")){ errores.push(`Fila ${i+2}: el puntaje "${pt}" debe ser un número entero de 1 a 5`); return; }
        const fila={evaluacion_id:eid,competencia_id:cid,puntaje:v,evidencia:ev||null};
        if(D.v36&&k){ fila.resultado_kpi=k.real; fila.nota_kpi=k.nota; fila.justificacion=just||null; if(Math.abs(v-k.nota)>=CFG.kpi_desvio&&!just) desv++; }
        ok.push(fila); });
      const porEval={}; ok.forEach(r=>(porEval[r.evaluacion_id]=porEval[r.evaluacion_id]||new Set()).add(r.competencia_id));
      const completas=Object.entries(porEval).filter(([eid,set])=>compsDelPuesto(porId[eid].puesto_id).every(c=>set.has(c.id))).map(([eid])=>Number(eid));
      out.innerHTML=`<div class="aviso">${ok.length} puntajes válidos · ${Object.keys(porEval).length} evaluaciones · ${completas.length} quedarán completas${calc?` · ${calc} calculados desde el resultado del KPI`:""}${desv?`<div style="color:var(--warn);font-size:12px;margin-top:4px">⚠ ${desv} puntaje(s) se apartan de la nota del KPI sin justificación.</div>`:""}${errores.length?`<div style="color:var(--red);font-size:12px;margin-top:6px;max-height:120px;overflow:auto">${errores.slice(0,100).map(esc).join("<br>")}</div>`:""}</div>
        ${ok.length?`<button class="btn amber sm" id="cr-ok">Cargar ${ok.length} puntajes</button>`:""}<div class="msg" id="cr-msg"></div>`;
      if(!ok.length) return;
      m.querySelector("#cr-ok").onclick=async()=>{
        const msg=m.querySelector("#cr-msg"); m.querySelector("#cr-ok").disabled=true; msg.className="msg"; msg.textContent="Cargando...";
        for(let i=0;i<ok.length;i+=500){ const { error } = await sb.from("respuestas").upsert(ok.slice(i,i+500),{onConflict:"evaluacion_id,competencia_id"}); if(error){ msg.className="msg error"; msg.textContent="Error: "+error.message; return; } }
        const ahora=new Date().toISOString();
        for(let i=0;i<completas.length;i+=200){ await sb.from("evaluaciones").update({estado:"completada",completada_en:ahora}).in("id",completas.slice(i,i+200)); }
        msg.className="msg ok"; msg.textContent=`✅ Se cargaron ${ok.length} puntajes y se completaron ${completas.length} evaluaciones.`;
        m.querySelector("[data-cerrar]").onclick=()=>{ cerrarModal(); irA("resultados",{pid,recargar:true}); };
      };
    };
  });
}

function ideasPara(comp){
  const t=normTxt(comp);
  const pts=IDEAS_GRUPALES.filter(i=>i.claves[0]!=="*").map(i=>({i,s:i.claves.filter(k=>t.includes(k)).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.i);
  const gen=IDEAS_GRUPALES.find(i=>i.claves[0]==="*");
  return [...pts.slice(0,3),...(pts.length<3?[gen]:[])];
}
// ---- Objetivo SMART ----
function objetivoGrupal(o){
  return `Reducir del ${o.base}% al ${o.meta}% la proporción de colaboradores de ${o.dep} con brecha significativa o crítica en «${o.comp}», mediante el programa «${o.nombre}», entre el ${fmtFecha(o.inicio)} y el ${fmtFecha(o.fin)}, sin costo adicional, midiendo ${({"semanal":"cada semana","quincenal":"cada quince días","mensual":"cada mes","por cierre":"en cada cierre"})[normTxt(o.frecuencia)]||"cada mes"} el indicador «${o.kpi}» (meta ${o.kpiMeta}) y el resultado en la siguiente campaña 180°.`;
}
function objetivoIndividual(o){
  return `Elevar el nivel en «${o.comp}» de ${o.base} a ${o.meta} (brecha actual ${o.brecha}) mediante: ${o.accion.replace(/\.$/,"")}; verificado con «${o.indicador||"el indicador del puesto"}» al ${fmtFecha(o.fin)}.`;
}
function evaluarSMART(txt, datos){
  const t=normTxt(txt||"");
  const c=[
    ["S","Específico",!!datos.accion&&t.length>40&&!!datos.comp&&t.includes(normTxt(datos.comp).slice(0,10))],
    ["M","Medible",/\d/.test(t)&&!!datos.kpiNombre&&!!datos.kpiMeta],
    ["A","Alcanzable",datos.base!=null&&datos.meta!=null&&Number(datos.meta)!==Number(datos.base)&&(datos.tipo!=="grupal"||Number(datos.meta)>=Math.round(Number(datos.base)*0.3))],
    ["R","Relevante",!!datos.comp],
    ["T","Temporal",!!datos.fin&&(!datos.inicio||datos.fin>datos.inicio)],
  ];
  return c;
}
function smartHTML(c){ return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${c.map(([l,n,ok])=>`<span class="badge ${ok?"b-ok":"b-gris"}" title="${n}">${ok?"✓":"○"} ${l} · ${n}</span>`).join("")}</div>`; }

      const fila={periodo_id:Number(pid),evaluado_id:null,competencia:g.comp,departamento:g.dep,tipo:"grupal",accion:d.accion,indicador:d.kpiNombre,fecha_seguimiento:sumarDias(d.inicio,30),estado:"en_curso",responsable:q("#gp-r").value.trim()||"RRHH",acompanamiento:"Jefaturas del área",personas:g.n};
      const extra={nombre_programa:d.nombre,objetivo_smart:q("#gp-o").value.trim(),kpi,fecha_inicio:d.inicio,fecha_fin:d.fin};

// Socialización: antes de evaluar, cada persona conoce y firma las reglas (políticas, indicadores, metas)

function fichaUsuario(c, conIndicadores){
  const p=[];
  const pc=c.politica_id&&D.politicaPorId?.[c.politica_id];
  if(c.politica) p.push(`<b>Política${pc&&pc.codigo?` ${esc(pc.codigo)} v${esc(pc.version||"1.0")}`:""}:</b> ${esc(c.politica)}`);
  if(conIndicadores){ if(c.indicador) p.push(`<b>Indicador:</b> ${esc(c.indicador)}`); if(c.meta) p.push(`<b>Meta:</b> ${esc(c.meta)}`); }
  return p.length?`<div class="ficha">${p.join(" · ")}</div>`:"";
}
function reglasDelJuego(e, evsPeriodo, continuar){

  const puestos=[...new Set(evsPeriodo.map(x=>x.puesto_id))];

  const per=D.periodos.find(p=>p.id===e.periodo_id)||{};
  abrirModal(`<h3>Reglas de la evaluación</h3><div style="color:var(--muted);font-size:12.5px;margin-bottom:12px">${esc(per.nombre)} · antes de evaluar, revisa ${soloAuto?"las competencias y políticas de tu puesto":"cómo se evalúa cada competencia"}.</div>
    <div style="max-height:52vh;overflow:auto;padding-right:4px">${puestos.map(pid=>{ const full=deJefe.has(pid);
      return `<div class="catchip" style="margin:6px 0 8px"><span class="d"></span>${esc(D.puestoPorId[pid]?.nombre)}${!soloAuto?(full?" · equipo que evalúas":" · tu autoevaluación"):""}</div>${compsDelPuesto(pid).map(c=>`<div style="padding:8px 0;border-bottom:1px solid var(--line-2)"><b>${esc(c.categoria)}</b><div style="font-size:13px">${esc(c.texto)}</div>${fichaUsuario(c,full)}</div>`).join("")}`; }).join("")}
      <div class="explbox">Escala: 1 Deficiente · 2 Regular · 3 Bueno · 4 Muy bueno · 5 Excelente. ${soloAuto?"Califícate con honestidad, pensando en hechos concretos del periodo.":"Califica con base en hechos del periodo y en el indicador de cada competencia."}</div>
      ${!soloAuto&&modoKPI()?`<div class="explbox"><b>Cómo se convierte el resultado del indicador en nota</b>${modoKPI()===1?" (nota sugerida; si te apartas "+CFG.kpi_desvio+" punto o más, debes justificar)":" (la nota es la del indicador)"}<div style="margin-top:8px">${tablaConversionHTML(true)}</div></div>`:""}</div>
    <label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-weight:500;font-size:13px"><input type="checkbox" id="rg-ok" style="margin-top:3px"> ${soloAuto?"Declaro que conozco las competencias y políticas con las que se realiza esta evaluación.":"Declaro que conozco las políticas, indicadores y metas con los que se realiza esta evaluación."}</label>
    <div class="msg" id="rg-msg"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn ghost sm" data-cerrar>Cancelar</button><button class="btn amber sm" id="rg-si">Firmar y continuar</button></div>`, m=>{
    m.querySelector("#rg-si").onclick=async()=>{
      if(!m.querySelector("#rg-ok").checked){ m.querySelector("#rg-msg").className="msg error"; m.querySelector("#rg-msg").textContent="Marca la casilla para continuar."; return; }
      // Evidencia para auditoría: qué versión de cada política se socializó en esta firma
      const comps=puestos.flatMap(pid=>compsDelPuesto(pid));
      const detalle={ fecha:new Date().toISOString(), puestos, competencias:comps.length,
        politicas:[...new Map(comps.filter(c=>c.politica).map(c=>{ const p=c.politica_id&&D.politicaPorId?.[c.politica_id];
          return [p?"id"+p.id:"t"+c.politica, p?{id:p.id,codigo:p.codigo,nombre:p.nombre,version:p.version}:{nombre:c.politica}]; })).values()] };
      const base={perfil_id:PERFIL.id,evaluado_id:PERFIL.id,periodo_id:e.periodo_id,tipo:"politicas"};
      let { error } = await sb.from("acuses").insert(D.v34?{...base,detalle}:base);

async function abrirFormulario(evalId){

      ${!esAuto&&c.indicador?`<div class="evid"><label for="ev-${c.id}">Resultado real del indicador${modoKPI()&&interpretarMeta(c.meta)?` <span class="sub-t" style="font-weight:500">· escribe el número (ej. 97% · 2)${modoKPI()===2?" — la nota sale del KPI":""}</span>`:""}</label><input class="inp" id="ev-${c.id}" data-evid="${c.id}" value="${esc(ya[c.id]?.evidencia)}" placeholder="Ej. 97% · 2 errores en el mes" ${solo?"disabled":""}>
        <div class="sub-t" id="kn-${c.id}" style="margin-top:6px"></div>
        <div id="kj-w-${c.id}" style="display:none;margin-top:8px"><label for="kj-${c.id}" style="color:var(--warn)">Justificación obligatoria: tu nota se aparta de la que da el indicador</label><textarea class="inp" id="kj-${c.id}" data-just="${c.id}" rows="2" placeholder="Explica con hechos por qué la nota es distinta" ${solo?"disabled":""}>${esc(ya[c.id]?.justificacion)}</textarea></div></div>`:""}</div>`; });
  $("contenido").innerHTML=`<div class="formwrap">
    <button class="btn ghost sm" id="fm-volver" style="margin-bottom:14px">← Volver</button>
    <div class="evhead"><img class="brandimg" alt="Etinar" src="${$("logo-app").src}" style="height:26px">

      <div class="meta"><span><b>Puesto:</b> ${esc(D.puestoPorId[ev.puesto_id]?.nombre)}</span><span><b>Campaña:</b> ${esc(per.nombre)}</span><span><b>Fecha límite:</b> ${fmtFecha(per.fecha_fin)}</span></div>
      <div class="progtop"><div id="fm-bar" style="width:0%"></div></div></div>
    ${solo?`<div class="aviso">${per.estado==="cerrado"?"📁 La campaña está cerrada. Esta evaluación queda en solo lectura como constancia.":"✅ Evaluación enviada. Se muestra en solo lectura."}</div>`:`<div class="aviso">🔒 ${esAuto?"Tu jefe directo no verá tus respuestas mientras la campaña esté abierta.":"El colaborador no verá tus respuestas mientras la campaña esté abierta."} ${esAuto?"Califícate con honestidad, pensando en hechos concretos del periodo.":"Califica según el indicador y la meta de cada competencia."}</div>`}
    ${comps.length?html:`<div class="card"><div class="vacio">Este puesto aún no tiene competencias. Avisa a RRHH.</div></div>`}
    <div class="catchip"><span class="d"></span>Comentarios</div>
    <div class="q"><div class="campo"><label for="cm-f">Fortalezas</label><textarea class="inp" id="cm-f" rows="2" ${solo?"disabled":""}>${esc(com?.fortalezas)}</textarea></div>
      <div class="campo"><label for="cm-a">Áreas de mejora</label><textarea class="inp" id="cm-a" rows="2" ${solo?"disabled":""}>${esc(com?.areas_mejora)}</textarea></div>

  actualizar();

      filas.push(fila); });

      if(sinJ){ msg.className="msg error"; msg.textContent=`Escribe la justificación en «${sinJ.categoria}»: tu nota se aparta de la que da el indicador.`; $("kj-"+sinJ.id).scrollIntoView({behavior:"smooth",block:"center"}); return; }
      const sinReal=modoKPI()===2&&comps.find(c=>interpretarMeta(c.meta)&&c.indicador&&!kpiDe(c.id));

    if(faltan){ msg.className="msg error"; msg.textContent=`Faltan ${faltan} competencia(s) por calificar.`; [...document.querySelectorAll(".scale")].find(x=>!x.querySelector(".sel"))?.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    $("fm-ok").disabled=true; $("fm-ok").textContent="Enviando...";
    let e1=(await sb.from("respuestas").upsert(filas,{onConflict:"evaluacion_id,competencia_id"})).error;
    if(e1&&/nota_kpi|resultado_kpi|justificacion/i.test(e1.message)){ filas.forEach(f=>{ delete f.nota_kpi; delete f.resultado_kpi; delete f.justificacion; }); e1=(await sb.from("respuestas").upsert(filas,{onConflict:"evaluacion_id,competencia_id"})).error; }
    const e2=e1?null:(await sb.from("comentarios").upsert({evaluacion_id:Number(evalId),fortalezas:$("cm-f").value.trim(),areas_mejora:$("cm-a").value.trim(),aspectos_mejorar_evaluador:esAuto?null:($("cm-e").value.trim()||null)},{onConflict:"evaluacion_id"})).error;
    const e3=(e1||e2)?null:(await sb.from("evaluaciones").update({estado:"completada",completada_en:new Date().toISOString()}).eq("id",evalId)).error;
    const err=e1||e2||e3;
    if(err){ msg.className="msg error"; msg.textContent=/row-level/i.test(err.message)?"No se pudo guardar: la campaña de esta evaluación está cerrada.":"Error al guardar: "+err.message; $("fm-ok").disabled=false; $("fm-ok").textContent="Guardar y enviar"; return; }
    msg.className="msg ok"; msg.textContent="✅ Evaluación enviada. ¡Gracias!"; setTimeout(()=>irA("mis"),1000);
  };
}
// ---- Mi resultado (colaborador): se ve al cerrar la campaña; acuse y réplica ----
VISTAS.miresultado = async ()=>{
  const cerrados=D.periodos.filter(p=>p.estado==="cerrado");
  const evs=(await traerTodo(()=>sb.from("evaluaciones").select("*").eq("evaluado_id",PERFIL.id))).filter(e=>cerrados.some(p=>p.id===e.periodo_id));
  const pids=[...new Set(evs.map(e=>e.periodo_id))];
  if(!pids.length){ $("contenido").innerHTML=encabezado("Mi resultado","")+`<div class="card"><div class="vacio">Tu resultado aparecerá aquí cuando RRHH cierre la campaña de evaluación.</div></div>`; return; }
  const pid=pids.sort((a,b)=>b-a)[0];
  const x=(await analizarPeriodo(pid,{evs:evs.filter(e=>e.periodo_id===pid)}))[0];
  const ex=await extrasPersona(x); const per=D.periodos.find(p=>p.id===pid);
  const ac=ex.acuses.find(a=>a.tipo==="resultado"&&a.perfil_id===PERFIL.id);
  $("contenido").innerHTML=`<div>${encabezado("Mi resultado",`${esc(per.nombre)} · ${esc(x.puesto)}`,`<button class="btn sm" onclick="window.print()">Descargar PDF</button>`)}
    <div class="card" style="border:1.5px solid ${ac?"var(--line)":"var(--amber)"}"><h3>${ac?"✅ Acuse firmado":"Acuse de recibo y réplica"}</h3>
      ${ac?`<div class="cap">Firmado el ${fmtFecha(ac.creado_en)}.${ac.comentario?" Tu réplica quedó registrada.":""}</div>${ac.comentario?`<div class="aviso">${esc(ac.comentario)}</div>`:""}`
      :`<div class="cap">Confirma que revisaste tu resultado. Si no estás de acuerdo con alguna valoración, escribe tu réplica: queda registrada y RRHH la revisa.</div>
        <div class="campo"><label for="mr-c">Réplica u observaciones (opcional)</label><textarea class="inp" id="mr-c" rows="3"></textarea></div><button class="btn amber sm" id="mr-ok">Firmar acuse</button><div class="msg" id="mr-msg"></div>`}
    </div>
    <div class="mt">${informeHTML(x,ex,"colaborador")}</div></div>`;
  if($("mr-ok")) $("mr-ok").onclick=async()=>{ const { error } = await sb.from("acuses").insert({perfil_id:PERFIL.id,evaluado_id:PERFIL.id,periodo_id:pid,tipo:"resultado",comentario:$("mr-c").value.trim()||null});
    if(error){ $("mr-msg").className="msg error"; $("mr-msg").textContent=error.message; return; } irA("miresultado"); };
};
// ---- Mi equipo (jefe): resultados del equipo al cerrar, aceptar planes y seguimiento ----
VISTAS.equipo = async (arg)=>{
  if(arg&&arg.persona) return verInforme(arg.persona,"equipo");
  const equipo=D.perfiles.filter(p=>p.jefe_id===PERFIL.id);
  const cerrados=D.periodos.filter(p=>p.estado==="cerrado");
  const pid=(arg&&arg.pid)||cerrados[0]?.id;
  if(!equipo.length){ $("contenido").innerHTML=encabezado("Mi equipo","")+`<div class="card"><div class="vacio">RRHH aún no te ha asignado colaboradores en el organigrama.</div></div>`; return; }
  let personas=[], planes=[], acuses=[];
  if(pid){
    const evs=(await traerPorLotes(equipo.map(p=>p.id), l=>sb.from("evaluaciones").select("*").eq("periodo_id",pid).in("evaluado_id",l)));
    personas=(await analizarPeriodo(pid,{evs})).filter(x=>equipo.some(p=>p.id===x.id));
    planes=await traerPorLotes(equipo.map(p=>p.id), l=>sb.from("planes").select("*").eq("periodo_id",pid).in("evaluado_id",l));
    acuses=(await traerPorLotes(equipo.map(p=>p.id), l=>sb.from("acuses").select("*").eq("periodo_id",pid).in("evaluado_id",l)));
  }
  if(!D.acciones.length){ const { data } = await sb.from("acciones").select("*"); D.acciones=data||[]; }
  const hoy=hoyISO();
  const porHacer=planes.filter(p=>p.estado==="propuesto"||(p.estado==="en_curso"&&p.fecha_seguimiento<=hoy));
  $("contenido").innerHTML=`<div>
    ${encabezado("Mi equipo",`${equipo.length} colaboradores a tu cargo`,cerrados.length?`<select class="inp" id="eq-per">${opciones(cerrados.map(p=>[p.id,p.nombre]),pid)}</select>`:"")}
    ${!pid?`<div class="card"><div class="vacio">Los resultados de tu equipo aparecen cuando RRHH cierra una campaña.</div></div>`:`
    <div class="grid4">
      <div class="card kpi"><div class="lbl">Resultado promedio del equipo</div><div class="val">${f2(prom(personas.map(x=>x.prom180)))}</div><div class="delta">${nivelDe(prom(personas.map(x=>x.prom180))).txt}</div></div>
      <div class="card kpi"><div class="lbl">Planes por aceptar</div><div class="val">${planes.filter(p=>p.estado==="propuesto").length}</div><div class="delta">solo aceptar o modificar</div></div>
      <div class="card kpi"><div class="lbl">Seguimientos pendientes</div><div class="val" style="color:${planes.some(p=>p.estado==="en_curso"&&p.fecha_seguimiento<=hoy)?"var(--red)":"inherit"}">${planes.filter(p=>p.estado==="en_curso"&&p.fecha_seguimiento<=hoy).length}</div><div class="delta">una pregunta por plan</div></div>
      <div class="card kpi"><div class="lbl">Resultados revisados</div><div class="val">${acuses.filter(a=>a.tipo==="resultado"&&a.perfil_id===PERFIL.id).length}/${personas.length}</div><div class="delta">acuse del jefe</div></div>
    </div>
    ${porHacer.length?`<div class="card mt" style="border:1.5px solid var(--amber)"><h3>Por hacer</h3><div class="cap">Acepta las acciones propuestas por RRHH o registra el seguimiento cuando llegue la fecha. Cada una toma menos de un minuto.</div>
      <div class="tabla-wrap"><table><thead><tr><th>Colaborador</th><th>Competencia</th><th>Acción</th><th>Fecha</th><th></th></tr></thead><tbody>${porHacer.map(p=>`<tr><td><b>${esc(perfil(p.evaluado_id)?.nombre)}</b></td><td>${esc(p.competencia)}</td><td style="min-width:220px">${esc(p.accion)}</td><td class="num">${fmtFecha(p.fecha_seguimiento)}</td><td class="r" style="white-space:nowrap">${botonesPlan(p)}</td></tr>`).join("")}</tbody></table></div></div>`:""}
    <div class="card mt" style="padding:0;overflow:hidden"><div class="tabla-wrap" style="margin:0;padding:0"><table><thead><tr><th style="padding-left:18px">Colaborador</th><th class="c">Resultado</th><th>Nivel</th><th class="c">Brechas</th><th>Clasificación</th><th>Acuses</th><th></th></tr></thead><tbody>${personas.map(x=>{
      const aC=acuses.find(a=>a.tipo==="resultado"&&a.perfil_id===x.id), aJ=acuses.find(a=>a.tipo==="resultado"&&a.perfil_id===PERFIL.id&&a.evaluado_id===x.id);
      return `<tr><td style="padding-left:18px"><div class="who"><div class="ava-s">${iniciales(x.nombre)}</div><div><b>${esc(x.nombre)}</b><div class="sub-t">${esc(x.puesto)}</div></div></div></td><td class="c num"><b>${f2(x.prom180)}</b></td><td>${nivelHTML(x.prom180)}</td><td class="c">${x.nCrit?`<span class="sem s3">${x.nCrit}</span> `:""}${x.nSig?`<span class="sem s2">${x.nSig}</span>`:""}</td><td><span class="badge ${x.clasif.cls}">${x.clasif.txt}</span></td>
        <td class="sub-t">Colab.: ${aC?"✔":"—"}${aC&&aC.comentario?" (réplica)":""} · Jefe: ${aJ?"✔":`<button class="btn ghost xs" data-acj="${x.id}">Firmar</button>`}</td><td class="r"><button class="btn ghost xs" data-eqx="${x.id}">Ver informe</button></td></tr>`; }).join("")||`<tr><td colspan="7" class="vacio">Sin resultados en esta campaña.</td></tr>`}</tbody></table></div></div>`}
  </div>`;
  if($("eq-per")) $("eq-per").onchange=e=>irA("equipo",{pid:Number(e.target.value)});
  enlazarPlanes(planes,()=>irA("equipo",{pid}));
  document.querySelectorAll("[data-eqx]").forEach(b=>b.onclick=()=>verInforme(personas.find(x=>x.id===b.dataset.eqx),"equipo"));
  document.querySelectorAll("[data-acj]").forEach(b=>b.onclick=async()=>{ if(!await confirmar("Confirmas que revisaste el resultado con el colaborador en una reunión de retroalimentación.","Firmar")) return;
    const { error } = await sb.from("acuses").insert({perfil_id:PERFIL.id,evaluado_id:b.dataset.acj,periodo_id:pid,tipo:"resultado"}); if(error) aviso(esc(error.message)); irA("equipo",{pid}); });
};

// ==================== Exportaciones ====================
function exportarExcel(nombre, hojas){
  if(typeof XLSX==="undefined"||!XLSX.utils){ aviso("No se pudo cargar el generador de Excel. Revisa tu conexión e inténtalo de nuevo."); return; }
  const wb=XLSX.utils.book_new();
  hojas.forEach(h=>{ const ws=XLSX.utils.json_to_sheet(h.filas.length?h.filas:[{"Sin datos":""}]);
    const cols=Object.keys(h.filas[0]||{"Sin datos":""}); ws["!cols"]=cols.map(c=>({wch:Math.min(60,Math.max(10,c.length+2,...h.filas.slice(0,200).map(f=>String(f[c]??"").length+1)))}));
    XLSX.utils.book_append_sheet(wb, ws, h.nombre.slice(0,31)); });
  XLSX.writeFile(wb, `${nombre}_${hoyISO()}.xlsx`);
}
function tablaWord(cab, filas){
  return `<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;font-size:9.5pt;width:100%"><tr style="background:#16130E;color:#fff">${cab.map(c=>`<th style="text-align:left">${esc(c)}</th>`).join("")}</tr>${filas.map(f=>`<tr>${f.map(v=>`<td>${esc(v??"")}</td>`).join("")}</tr>`).join("")}</table>`;
}
function exportarWord(nombre, titulo, cuerpo){
  const fecha=new Date().toLocaleDateString("es-EC",{year:"numeric",month:"long",day:"numeric"});
  const doc=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(titulo)}</title></head>
  <body style="font-family:Calibri,Arial,sans-serif;color:#16130E;font-size:11pt">
  <table width="100%"><tr><td><img src="${$("logo-app")?.src||""}" height="34"></td><td style="text-align:right;font-size:9pt;color:#777">Generado: ${fecha}</td></tr></table>
  <hr style="border:none;border-top:2px solid #EEBC1F"><h2 style="font-size:16pt">${esc(titulo)}</h2>${cuerpo}
  <p style="font-size:8pt;color:#999;margin-top:24px">Documento generado por el Portal de Evaluación de Desempeño 180° · Etinar S.A.</p></body></html>`;
  descargarBlob(new Blob(["﻿"+doc],{type:"application/msword"}), `${nombre}_${hoyISO()}.doc`);
}
function descargarBlob(blob, nombre){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
// Matriz de brechas (Armstrong) + resumen por persona — respeta los filtros aplicados
function exportarResultados(personas, periodoNombre){
  const matriz=[], resumen=[];
  personas.forEach(x=>{
    resumen.push({Colaborador:x.nombre,Cédula:x.perfil?.cedula||"",Cargo:x.puesto,Área:x.departamento,"Jefe directo":x.jefe?.nombre||"",Campaña:periodoNombre||"",
      "Autoevaluación":x.promA==null?"":+x.promA.toFixed(2),"Valoración del jefe":x.promJ==null?"":+x.promJ.toFixed(2),"Resultado 180°":x.prom180==null?"":+x.prom180.toFixed(2),
      Nivel:x.nivel.txt,"Brechas significativas":x.nSig,"Brechas críticas":x.nCrit,"Brecha de autoconciencia":x.brechaAuto??"",Clasificación:x.clasif.txt,"Acción recomendada":x.clasif.accion});
    x.filas.forEach(f=>matriz.push({Colaborador:x.nombre,Cargo:x.puesto,Área:x.departamento,Competencia:f.c.categoria,Conducta:f.c.texto,"Competencia crítica":f.c.critico?"Sí":"No",
      "Nivel esperado":f.esperado,"Evaluación jefe":f.j??"",Autoevaluación:f.a??"","Resultado 180°":f.r??"","Peso en la nota (%)":x.ponderado&&f.pesoEf!=null?Math.round(f.pesoEf):"","Aporte a la nota":x.ponderado&&f.aporte!=null?+f.aporte.toFixed(2):"","Resultado real del indicador":f.evidencia||"","Nota según KPI":f.kpi?f.kpi.nota:"","Justificación del jefe":f.justificacion||"",
      Brecha:f.bd??"","Nivel de brecha":f.nb.txt,"Brecha autoconciencia":f.ba??"","Acción recomendada":f.nb.i>=3?"Plan de Desarrollo Individual":f.nb.i===2?"Acción de desarrollo / acompañamiento":f.nb.i===1?"Seguimiento normal":f.nb.i===0?"Mantener / potenciar":""}));
  });
  exportarExcel("Resultados_Etinar",[{nombre:"Resumen por persona",filas:resumen},{nombre:"Matriz de brechas",filas:matriz}]);
}
function exportarInformeWord(x, ex, per){
  const pd=x.ponderado;
  const filas=x.filas.map(f=>[f.c.categoria+(f.c.critico?" (crítica)":""),f.esperado.toFixed(1),f.a??"—",f.j??"—",f.r??"—",...(pd?[f.pesoEf==null?"—":Math.round(f.pesoEf)+"%",f.aporte==null?"—":f.aporte.toFixed(2)]:[]),f.bd==null?"—":f.bd.toFixed(2),f.nb.txt,f.ba==null?"—":signo(f.ba)]);
  const cuerpo=`<p><b>Colaborador:</b> ${esc(x.nombre)} · <b>Cargo:</b> ${esc(x.puesto)} · <b>Área:</b> ${esc(x.departamento)}<br><b>Campaña:</b> ${esc(per.nombre||"")} · <b>Jefe directo:</b> ${esc(x.jefe?.nombre||"")}</p>
    <table border="1" cellspacing="0" cellpadding="8" style="border-collapse:collapse;width:100%;font-size:10pt;background:#FBF4DC"><tr><td><b>Resultado 180°</b><br>${f2(x.prom180)}</td><td><b>Nivel</b><br>${x.nivel.txt}</td><td><b>Brecha de autoconciencia</b><br>${signo(x.brechaAuto)}</td><td><b>Clasificación</b><br>${esc(x.clasif.txt)}</td></tr></table>
    <h3>Análisis de brechas</h3>${tablaWord(["Competencia","Esperado","Auto","Jefe","Resultado",...(pd?["Peso","Aporte"]:[]),"Brecha","Nivel de brecha","Autoconciencia"],filas)}${pd?`<p style="font-size:9pt;color:#555">Nota ponderada: cada competencia aporta según su peso en el puesto; las que no tienen peso cuentan con el peso promedio.</p>`:""}
    <p style="font-size:9pt;color:#555">Brecha de desempeño = nivel esperado − resultado. Significativa desde ${CFG.brecha_significativa.toFixed(2)}; crítica desde ${CFG.brecha_critica.toFixed(2)}.</p>
    <h3>Interpretación</h3>${interpretacion(x)}
    <h3>Clasificación del caso: ${esc(x.clasif.txt)}</h3><p>${esc(x.clasif.accion)}</p>
    ${ex.planes.length?`<h3>Plan y seguimiento</h3>${tablaWord(["Competencia","Tipo","Acción","Indicador","Responsable","Seguimiento","Estado"],ex.planes.map(p=>[p.competencia,TIPO_PLAN[p.tipo],p.accion,p.indicador,p.responsable,fmtFecha(p.fecha_seguimiento),EST_PLAN[p.estado][0]+(p.resultado?" · "+RES_PLAN[p.resultado][0]:"")]))}`:""}
    <br><br><table width="100%" style="font-size:10pt"><tr><td style="text-align:center">_________________________<br>Colaborador</td><td style="text-align:center">_________________________<br>Jefe directo</td><td style="text-align:center">_________________________<br>Talento Humano</td></tr></table>`;
  exportarWord("Informe_180_"+soloAlnum(x.nombre),"Informe de Evaluación de Desempeño 180°",cuerpo);
}
// Respaldo completo de todas las tablas (para guardar al cerrar cada campaña)
async function respaldoCompleto(){
  if(!await confirmar("Se descargará un Excel con todas las tablas de la plataforma (usuarios, campañas, competencias, evaluaciones, respuestas, planes, acuses). Guárdalo en una carpeta segura de RRHH.","Descargar respaldo")) return;
  const tablas=["perfiles","puestos","competencias","periodos","evaluaciones","respuestas","comentarios","planes","acuses","acciones","configuracion"];
  const hojas=[];
  for(const t of tablas){ try{ const filas=await traerTodo(()=>sb.from(t).select("*"), t==="configuracion"?"clave":"id"); hojas.push({nombre:t,filas:filas.map(f=>{ const o={}; for(const k in f) o[k]=typeof f[k]==="object"&&f[k]!==null?JSON.stringify(f[k]):f[k]; return o; })}); }catch(e){ hojas.push({nombre:t,filas:[{error:e.message}]}); } }
  exportarExcel("Respaldo_Evaluacion180_Etinar",hojas);
}
