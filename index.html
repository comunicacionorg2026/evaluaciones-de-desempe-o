<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Evaluación de Desempeño 180° · Etinar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Diseño refinado Etinar v2_3 — barra superior, tarjetas claras, amarillo Etinar como acento */
:root{
  --amber:#EEBC1F;--amber-d:#D6A70F;--amber-soft:#FBF4DC;
  --ink:#16130E;--ink-2:#565049;--muted:#8A8377;
  --bg:#FBFBFA;--card:#FFFFFF;--line:#EEEDEA;--line-2:#F5F4F2;
  --blue:#2563EB;--ochre:#B4890F;--ok:#15803D;--ok-bg:#E7F6EC;--warn:#B45309;--warn-bg:#FBF0D8;--red:#DC2626;--red-bg:#FBE4E0;
  --shadow-sm:0 1px 2px rgba(20,16,10,.04);
  --shadow:0 1px 3px rgba(20,16,10,.05),0 10px 30px -12px rgba(20,16,10,.12);
  --shadow-lg:0 20px 60px -20px rgba(20,16,10,.28);
  --r:20px;--r-sm:13px;--ease:cubic-bezier(.22,.61,.36,1);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.oculto{display:none!important}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@keyframes fadeUp{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim{animation:fadeUp .35s var(--ease) both}
@media (prefers-reduced-motion:reduce){.anim{animation:none}}
.num{font-variant-numeric:tabular-nums}

/* ---------- ACCESO ---------- */
#vista-login,#vista-recovery{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:hidden;background:linear-gradient(135deg,#17140F 0%,#221D15 55%,#2C2616 100%)}
.bp{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;background:radial-gradient(1000px 700px at 30% 40%,transparent,rgba(0,0,0,.35))}
.glass{position:relative;z-index:2;width:100%;max-width:410px;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.5);border-radius:26px;box-shadow:var(--shadow-lg);padding:38px 32px;text-align:center}
.glass .brandimg{height:46px;margin:0 auto 20px}
.glass h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.glass .sub{color:var(--muted);font-size:14px;margin:6px 0 26px}
.glass form{text-align:left}
label,.lbl-campo{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;font-size:14px;background:#FCFCFB;transition:.2s var(--ease);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);background:#fff}
textarea.inp{resize:vertical;min-height:70px}
.campo{margin-bottom:14px;min-width:0}
.btn{background:var(--ink);color:#fff;border:none;padding:12px 18px;border-radius:13px;font-size:14px;font-weight:600;transition:.2s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -10px rgba(20,16,10,.5)}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.btn.amber{background:var(--amber);color:var(--ink)}
.btn.amber:hover{background:var(--amber-d)}
.btn.full{width:100%}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--bg);box-shadow:none;transform:none}
.btn.danger{background:#fff;border:1.5px solid #F3C9C2;color:var(--red)}
.btn.danger:hover{background:#FEF4F2;box-shadow:none;transform:none}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn.xs{padding:5px 10px;font-size:12px;border-radius:9px}
.link{color:var(--ink-2);font-size:13px;text-decoration:none;display:inline-block;margin-top:16px;border-bottom:1px solid transparent}
.link:hover{border-color:var(--amber)}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.error{color:var(--red)} .msg.ok{color:var(--ok)}
.demo-box{margin-top:20px;border-top:1px dashed var(--line);padding-top:16px;text-align:left}

/* ---------- MENÚ LATERAL ---------- */
:root{--sb-w:236px}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;padding:18px 12px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:0 8px 18px}
.sidebar .brandimg{height:28px;display:block}
.sb-x{display:none;border:none;background:none;font-size:18px;color:var(--ink-2);padding:4px 8px}
.sidenav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.sb-grupo{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:16px 12px 6px}
.tab{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:transparent;font-size:13.5px;font-weight:600;color:var(--ink-2);padding:9px 12px;border-radius:10px;transition:.15s var(--ease);white-space:nowrap;position:relative}
.tab svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.tab:hover{background:var(--line-2);color:var(--ink)}
.tab.on{background:var(--amber-soft);color:var(--ink)}
.tab.on svg{opacity:1}
.tab.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.sb-user{border-top:1px solid var(--line);padding:12px 6px 4px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.sb-user .info{line-height:1.25;min-width:0}
.sb-user .info b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .info small{display:block;color:var(--muted);font-size:11.5px}
.sb-acc{grid-column:1/-1;display:flex;gap:6px;margin-top:8px}.sb-acc .salir{flex:1}
.app-col{margin-left:var(--sb-w);min-width:0}
.topmovil{display:none}
.sb-velo{display:none}
@media(max-width:980px){
  .sidebar{transform:translateX(-102%);transition:transform .25s var(--ease);box-shadow:var(--shadow-lg);width:min(280px,86vw)}
  body.sb-abierto .sidebar{transform:none}
  body.sb-abierto .sb-velo{display:block;position:fixed;inset:0;background:rgba(22,19,14,.4);z-index:35}
  .sb-x{display:block}
  .app-col{margin-left:0}
  .topmovil{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:rgba(251,251,250,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topmovil .brandimg{height:24px}
  .topmovil-t{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink-2)}
  .sb-burger{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;font-size:17px}
}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12.5px;flex-shrink:0}
.salir{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:12px;color:var(--ink-2)}
.salir:hover{border-color:var(--ink-2)}
.main{max-width:1240px;margin:0 auto;padding:28px 20px 90px}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.head h1{font-size:24px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.head .crumbs{color:var(--muted);font-size:13px;margin-top:3px}
.head .acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.head .acciones .inp{width:auto;min-width:220px;max-width:340px;padding:9px 12px}
.pill{background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:12px;padding:6px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px}
.pill .g{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pill .g.off{background:var(--muted)}

/* ---------- TARJETAS Y REJILLAS ---------- */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}}
.row2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:14px}
.row2.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:900px){.row2,.row2.eq{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm);min-width:0}
.mt{margin-top:14px}
.card h3{font-size:15.5px;font-weight:700}
.card .cap{font-size:12.5px;color:var(--muted);margin:4px 0 16px}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:10px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12px;font-weight:600;margin-top:4px;color:var(--muted)}
.kpi .bar{height:4px;background:var(--line-2);border-radius:999px;margin-top:12px;overflow:hidden}
.kpi .bar>div{height:100%;background:var(--amber);border-radius:999px}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fila>.campo{flex:1;min-width:160px;margin-bottom:0}
.sep{height:1px;background:var(--line);margin:18px 0}
.vacio{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
.explbox{margin-top:14px;background:var(--amber-soft);border:1px solid #F2E4B5;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#6b5a1e;line-height:1.55}
.aviso{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-2);margin:12px 0}
.aviso.amber{background:var(--amber-soft);border-color:#F2E4B5;color:#6b5a1e}
.aviso.rojo{background:#FEF4F2;border-color:#F3C9C2;color:#991B1B}

/* progreso */
.prog{display:flex;align-items:center;gap:12px;margin:12px 0}
.prog .name{width:150px;font-size:13px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{flex:1;height:8px;background:var(--line-2);border-radius:999px;overflow:hidden;min-width:60px}
.track>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--amber-d),var(--amber))}
.prog .pct{width:64px;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- TABLAS ---------- */
.tabla-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--line-2)}
td.c,th.c{text-align:center}
td.r,th.r{text-align:right}
.sub-t{font-size:11.5px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-wait{background:var(--warn-bg);color:var(--warn)}
.b-red{background:var(--red-bg);color:#B91C1C} .b-gris{background:var(--line-2);color:var(--ink-2)} .b-blue{background:#E7EEFE;color:var(--blue)}
.b-ink{background:var(--ink);color:var(--amber)}
.who{display:flex;align-items:center;gap:10px}
.ava-s{width:32px;height:32px;border-radius:50%;background:var(--line);color:var(--ink-2);font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.legend{display:flex;gap:16px;font-size:12.5px;font-weight:600;color:var(--ink-2);justify-content:center;flex-wrap:wrap;margin-top:8px}
.legend span{display:flex;align-items:center;gap:7px}
.swatch{width:11px;height:11px;border-radius:4px}
tr.bajo td{background:#FFF8F6}

/* semáforo de brecha */
.sem{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.sem::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sem.s0{background:var(--ok-bg);color:var(--ok)} .sem.s1{background:#EEF6EE;color:#3F7F3F}
.sem.s2{background:var(--warn-bg);color:var(--warn)} .sem.s3{background:var(--red-bg);color:#B91C1C}
.nivel{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.n5{background:var(--ok-bg);color:var(--ok)} .n4{background:#FBF1D4;color:#8A6A0B} .n3{background:#E7EEFE;color:var(--blue)} .n2{background:var(--warn-bg);color:var(--warn)} .n1{background:var(--red-bg);color:#B91C1C}
.tag-crit{font-size:10px;font-weight:700;background:var(--ink);color:var(--amber);padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;letter-spacing:.03em}
.ficha{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.5}
.ficha b{color:var(--ink);font-weight:600}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip:hover{border-color:var(--amber)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}

/* ---------- EVALUACIÓN ---------- */
.formwrap{max-width:800px;margin:0 auto}
.evhead{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow-sm)}
.evhead .who2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:2px;text-wrap:balance}
.evhead .meta{color:var(--muted);font-size:12.5px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.evhead .meta b{color:var(--ink-2);font-weight:600}
.progtop{height:6px;background:var(--line-2);border-radius:999px;margin-top:16px;overflow:hidden}
.progtop>div{height:100%;background:var(--amber);border-radius:999px;transition:width .4s var(--ease)}
.catchip{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;background:#fff;border:1px solid var(--line);padding:7px 14px;border-radius:999px;margin:24px 0 12px;box-shadow:var(--shadow-sm)}
.catchip .d{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 20px;margin-bottom:12px}
.q p{font-size:15px;font-weight:700;margin-bottom:6px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center;transition:.2s var(--ease);background:#FCFCFB;cursor:pointer;user-select:none}
.opt:hover{border-color:var(--amber)}
.opt .n{font-size:17px;font-weight:800}
.opt .t{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.opt.sel{background:var(--amber);border-color:var(--amber-d)}
.opt.sel .t{color:var(--ink)}
.solo .opt{cursor:default}
.evid{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.evid label{margin:0;white-space:nowrap}
.evid .inp{flex:1;min-width:160px;padding:9px 12px}
.sticky{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;box-shadow:var(--shadow);flex-wrap:wrap}
.sticky .st{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- INFORME ---------- */
.levelcard{display:flex;gap:20px;align-items:center}
.levelring{width:96px;height:96px;flex-shrink:0}
.classbox{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:14px;padding:18px 20px;margin-top:14px}
.classbox.perm{border-left-color:var(--red)} .classbox.ref{border-left-color:var(--ok)}
.pdi-h{background:var(--ink);color:#fff;border-radius:16px;padding:20px 22px;margin-top:14px}
.pdi-h .t{font-size:12px;color:#c9c3b6;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.gap-pos{color:var(--ok);font-weight:700}.gap-neg{color:var(--red);font-weight:700}

/* layout con filtro lateral */
.side-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.side-layout{grid-template-columns:1fr}}
.filtro label{margin-top:12px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(22,19,14,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:20px;max-width:640px;width:100%;padding:24px;box-shadow:var(--shadow-lg)}
.modal h3{font-size:17px;margin-bottom:4px}

/* mapa de calor */
.heat td.hc{text-align:center;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;border:2px solid #fff;border-radius:6px}

.org{padding-top:4px}
.org-nodo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;position:relative;box-shadow:var(--shadow-sm)}
.org-nodo.raiz{border:1.5px solid var(--amber)}
.org-hijos{margin-left:18px;padding-left:18px;border-left:2px solid var(--line)}
.org-hijos>.org-rama>.org-nodo::before{content:"";position:absolute;left:-20px;top:24px;width:18px;border-top:2px solid var(--line)}
@media(max-width:600px){.org-hijos{margin-left:6px;padding-left:12px}.org-hijos>.org-rama>.org-nodo::before{left:-14px;width:12px}}
/* primer ingreso */
.politica-txt{max-height:46vh;overflow:auto;text-align:left;font-size:13px;line-height:1.6;color:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);white-space:pre-line}
/* cinta demo */
.cinta-demo{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:var(--amber);text-align:center;font-size:12px;font-weight:700;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:99;letter-spacing:.04em}

@media print{
  .sidebar,.topmovil,.sb-velo,.no-print,.cinta-demo,.sticky{display:none!important} .app-col{margin-left:0!important}
  body{background:#fff}
  .main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
}
@media(min-width:981px){.cinta-demo{left:var(--sb-w)}}
.es-demo .sidebar{padding-bottom:42px}
.err-t{color:var(--red)}

</style>
</head>
<body>
<!-- ==================== ACCESO ==================== -->
<section id="vista-login">
  <svg class="bp" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none" aria-hidden="true">
    <g stroke="#EEBC1F" stroke-opacity="0.10" stroke-width="1"><path d="M0 620 H1440 M0 700 H1440 M0 780 H1440"/><path d="M120 900 V300 M300 900 V420 M1120 900 V360 M1330 900 V500"/></g>
    <g stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.4">
      <rect x="180" y="470" width="150" height="290"/>

  order(c,o){this.o.push([c,!(o&&o.ascending===false)]);return this;} range(a,b){this.rg=[a,b];return this;} limit(n){this.rg=[0,n-1];return this;}

// Trae TODAS las filas (Supabase entrega máximo 1.000 por consulta): pide por páginas
async function traerTodo(construir, orden="id"){
  const PAG=1000; let desde=0, todo=[];
  for(;;){
    let q=construir(); if(orden) q=q.order(orden,{ascending:true});
    const { data, error } = await q.range(desde, desde+PAG-1);
    if(error) throw error;
    todo=todo.concat(data||[]);
    if(!data || data.length<PAG) break;
    desde+=PAG;
  }
  return todo;
}

async function traerPorLotes(ids, construir, tam=150){

  for(let i=0;i<ids.length;i+=tam){ const lote=ids.slice(i,i+tam); todo=todo.concat(await traerTodo(()=>construir(lote))); }

}

    const esperado=esperadoDe(c);
    const bd = r==null?null:+(esperado-r).toFixed(2);
    const ba = (a!=null&&j!=null)?+(a-j).toFixed(2):null;
    return {c,a,j,r,esperado,bd,nb:nivelBrecha(bd),ba,sigBA:ba!=null&&Math.abs(ba)>=CFG.umbral_brecha-1e-9,evidencia:mJ[c.id]?.evidencia||"", kpi:mJ[c.id]?(mJ[c.id].nota_kpi!=null?{nota:mJ[c.id].nota_kpi}:null)||notaKPI(c.meta,mJ[c.id].evidencia):null, justificacion:mJ[c.id]?.justificacion||""};
  });
  const x={ ...g, id:g.evaluado_id, nombre:per.nombre, perfil:per, puesto:puesto.nombre||per.puesto||"—",
    departamento:puesto.departamento||per.departamento||"Sin departamento",
    jefe:perfil(g.evaluador_id||g.evalJ?.evaluador_id)||perfil(per.jefe_id), filas };
  // Pesos: con "nota ponderada" activa, cada competencia pesa según su % en el puesto.
  // Las que no tienen peso (p. ej. Valores Etinar) cuentan con el peso promedio de las demás.
  const ws=pesosDe(filas.map(f=>f.c)); filas.forEach((f,i)=>f.w=ws[i]);
  const sw=filas.reduce((s,f)=>s+(f.r!=null?f.w:0),0);
  filas.forEach(f=>{ f.pesoEf=f.r!=null&&sw?f.w*100/sw:null; f.aporte=f.r!=null&&sw?f.r*f.w/sw:null; });
  x.ponderado=CFG.usar_pesos>=1&&ws.some(v=>v!==1);
  x.promA=promPond(filas.map(f=>f.a),ws); x.promJ=promPond(filas.map(f=>f.j),ws); x.prom180=promPond(filas.map(f=>f.r),ws);
  x.brechaAuto = (x.promA!=null&&x.promJ!=null)?+(x.promA-x.promJ).toFixed(2):null;
  x.nSig=filas.filter(f=>f.nb.i===2).length; x.nCrit=filas.filter(f=>f.nb.i===3).length;
  x.nCritComp=filas.filter(f=>f.nb.i===3&&f.c.critico).length; x.nSigBA=filas.filter(f=>f.sigBA).length;
  x.brechaProm=prom(filas.map(f=>f.bd==null?null:Math.max(0,f.bd)));
  x.nivel=nivelDe(x.prom180); x.clasif=clasificar(x);
  x.completo=!!(g.jefeHecha&&g.autoHecha);
  return x;
}

// Biblioteca: busca la acción que mejor coincide con la competencia
function accionSugerida(c, nivelI){
  const cat=normTxt(c.categoria||""), txt=normTxt(c.texto||"");
  const quiere = nivelI>=3?"critica":"significativa";
  let mejor=null, pts=0;
  D.acciones.forEach(a=>{ const k=normTxt(a.competencia); if(!k||k==="general") return;
    const pal=k.split(/[\s,/]+/).filter(w=>w.length>3); let s=0;
    pal.forEach(w=>{ if(cat.includes(w)) s+=3; else if(txt.includes(w)) s+=1; });
    if(s>0) s+= a.nivel===quiere?0.5:0;
    if(s>pts){ pts=s; mejor=a; } });
  if(mejor) return mejor;
  const gen=D.acciones.filter(a=>normTxt(a.competencia)==="general");
  return gen.find(a=>a.nivel===quiere)||gen[0]||null;
}

// ==================== CONVERSIÓN DEL RESULTADO DEL KPI A NOTA 1-5 ====================
// Regla de Etinar (configurable en Periodos → Reglas):
//  · Metas "mayor es mejor" (≥95%, 100%, ≥20 visitas) y "menor es mejor" (≤2 días):
//      % de cumplimiento de la meta → nota  (≥100% = 5 · ≥95% = 4 · ≥85% = 3 · ≥70% = 2 · menos = 1)
//  · Metas "cero" (0 multas, sin incidentes): 0 = 5 · 1 = 3 · 2 = 2 · 3 o más = 1
//  · Modo: 0 = solo referencia · 1 = nota sugerida (si el jefe se aparta, justifica) · 2 = la nota es la del KPI
const NIV_TXT=["Deficiente","Regular","Bueno","Muy bueno","Excelente"];
const numDe=(t)=>{ const m=String(t??"").replace(/(\d)\.(\d{3})(?!\d)/g,"$1$2").replace(",",".").match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; };
function interpretarMeta(meta){
  const t=normTxt(meta||"").trim(); if(!t) return null;
  const pct=/%/.test(meta);
  if(/^(0|cero|sin|ningun|ninguna|ningún)\b/.test(t)||/^0\s*[a-z]/.test(t)) return {tipo:"cero",valor:0,pct:false,txt:"cero (0 es lo esperado)"};
  const v=numDe(t); if(v==null) return null;
  if(/(≤|<=|<|maximo|max\.?|hasta|menos de|no mas de|como maximo)/.test(t)) return {tipo:"menor",valor:v,pct,txt:`menor o igual a ${v}${pct?"%":""} (menos es mejor)`};
  return {tipo:"mayor",valor:v,pct,txt:`mayor o igual a ${v}${pct?"%":""} (más es mejor)`};
}
function notaDeCumplimiento(cumpl){
  if(cumpl>=CFG.kpi_t5-1e-9) return 5; if(cumpl>=CFG.kpi_t4-1e-9) return 4; if(cumpl>=CFG.kpi_t3-1e-9) return 3; if(cumpl>=CFG.kpi_t2-1e-9) return 2; return 1;
}
// Devuelve {nota, cumpl, m, real} o null si la meta o el resultado no son numéricos
function notaKPI(meta, realTxt){
  const m=interpretarMeta(meta), real=numDe(realTxt);
  if(!m||real==null||real<0) return null;
  if(m.tipo==="cero"){ const n=Math.round(real); return {nota:n<=0?5:n===1?3:n===2?2:1, cumpl:null, m, real}; }
  let cumpl;
  if(m.tipo==="mayor") cumpl=m.valor>0?real*100/m.valor:100;
  else cumpl=real<=m.valor?100:(real>0?m.valor*100/real:100);
  return {nota:notaDeCumplimiento(cumpl), cumpl:Math.round(cumpl*10)/10, m, real};
}
const modoKPI=()=>Math.round(CFG.kpi_modo||0);
function textoNotaKPI(k){
  if(!k) return "";
  return k.m.tipo==="cero"?`${k.real} ${k.real===1?"caso":"casos"} (meta: cero) → nota <b>${k.nota}</b> · ${NIV_TXT[k.nota-1]}`
    :`cumplimiento ${k.cumpl}% de la meta → nota <b>${k.nota}</b> · ${NIV_TXT[k.nota-1]}`;
}

  const cero=[["0 casos",5],["1 caso",3],["2 casos",2],["3 o más",1]];

// ==================== Gráficos (SVG a escala) ====================
function radarSVG(etiquetas, jefe, auto){
  const n=etiquetas.length; if(n<3) return `<div class="vacio">Se necesitan al menos 3 competencias para el radar.</div>`;
  const S=340,W=440,cx=220,cy=170,R=100,max=5;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n, pt=(i,v)=>[cx+R*v/max*Math.cos(ang(i)),cy+R*v/max*Math.sin(ang(i))];
  let g=`<svg viewBox="0 0 ${W} ${S}" width="100%" style="max-width:420px" role="img" aria-label="Comparativo por competencia: jefe y autoevaluación">`;
  for(let r=1;r<=max;r++){ g+=`<polygon points="${[...Array(n)].map((_,i)=>pt(i,r).join(",")).join(" ")}" fill="none" stroke="${r===max?"#E4E1DB":"#F0EEEA"}"/>`; }
  etiquetas.forEach((a,i)=>{ const [x,y]=pt(i,max); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#F0EEEA"/>`;
    const [lx,ly]=pt(i,max+1.05); const pal=String(a).split(/\s+/); const lin=[]; let cur="";
    pal.forEach(w=>{ if((cur+" "+w).trim().length>16){ if(cur) lin.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }); if(cur) lin.push(cur);
    const L=lin.slice(0,3); const anchor=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";
    g+=`<text x="${lx}" y="${ly-(L.length-1)*5.5}" font-size="10" font-weight="600" fill="#565049" text-anchor="${anchor}">${L.map((t,k)=>`<tspan x="${lx}" dy="${k?11:0}">${esc(t)}</tspan>`).join("")}</text>`; });
  const poly=(vals,c,f)=>{ if(vals.every(v=>v==null)) return ""; const p=vals.map((v,i)=>pt(i,v||0).join(",")).join(" ");
    return `<polygon points="${p}" fill="${f}" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`+vals.map((v,i)=>{ if(v==null) return ""; const [x,y]=pt(i,v); return `<circle cx="${x}" cy="${y}" r="3.4" fill="${c}" stroke="#fff" stroke-width="1.5"/>`; }).join(""); };
  g+=poly(jefe,"#2563EB","rgba(37,99,235,.12)")+poly(auto,"#B4890F","rgba(180,137,15,.15)")+`</svg>`;
  return `<div style="display:flex;flex-direction:column;align-items:center">${g}<div class="legend"><span><span class="swatch" style="background:#2563EB"></span>Valoración del jefe</span><span><span class="swatch" style="background:#B4890F"></span>Autoevaluación</span></div></div>`;
}
function anilloSVG(v){
  const p=v==null?0:Math.max(0,Math.min(1,v/5))*100;
  return `<svg class="levelring" viewBox="0 0 36 36" role="img" aria-label="Resultado ${f2(v)} de 5"><path d="M18 2.5a15.5 15.5 0 1 1 0 31 15.5 15.5 0 0 1 0-31" fill="none" stroke="#EFEDE8" stroke-width="3.2"/><path d="M18 2.5a15.5 15.5 0 1 1 0 31 15.5 15.5 0 0 1 0-31" fill="none" stroke="#EEBC1F" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${p.toFixed(1)} 100"/><text x="18" y="21" font-size="8" font-weight="800" text-anchor="middle" fill="#16130E">${f2(v)}</text></svg>`;
}
// Curva de desempeño: barras por nivel + curva suavizada
function curvaSVG(vals){
  const tot=vals.reduce((s,x)=>s+x,0);
  if(!tot) return `<div class="vacio">Sin resultados con estos filtros.</div>`;
  const W=420,H=240,pl=34,pb=44,pt=18,pr=12,n=5,gap=(W-pl-pr)/n,bw=gap*0.6, max=Math.max(...vals)*1.2||1;
  const x=i=>pl+gap*i+gap*0.2, y=v=>H-pb-(v/max)*(H-pb-pt);
  const paso=Math.max(1,Math.ceil(max/4));
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:440px" role="img" aria-label="Curva de desempeño por nivel">`;
  for(let v=0;v<=max;v+=paso){ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#F1EFEA"/><text x="${pl-6}" y="${y(v)+3}" font-size="9" fill="#8A8377" text-anchor="end">${v}</text>`; }
  NIVELES.forEach((c,i)=>{ const v=vals[i]; g+=`<rect x="${x(i)}" y="${y(v)}" width="${bw}" height="${Math.max(0,H-pb-y(v))}" rx="4" fill="${c.color}" opacity=".9"/>`;
    g+=`<text x="${x(i)+bw/2}" y="${y(v)-6}" font-size="10" font-weight="700" fill="#565049" text-anchor="middle">${v} · ${Math.round(v*100/tot)}%</text>`;
    g+=`<text x="${x(i)+bw/2}" y="${H-pb+15}" font-size="9.5" fill="#565049" text-anchor="middle">${c.txt}</text>`; });
  const pts=NIVELES.map((c,i)=>[x(i)+bw/2,y(vals[i])]); let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){ const [x0,y0]=pts[i],[x1,y1]=pts[i+1],cxm=(x0+x1)/2; d+=` C ${cxm} ${y0}, ${cxm} ${y1}, ${x1} ${y1}`; }
  g+=`<path d="${d}" fill="none" stroke="#16130E" stroke-width="2" stroke-opacity=".45"/></svg>`;
  return `<div style="display:flex;justify-content:center">${g}</div>`;
}
function tendenciaSVG(data){
  if(!data.length) return `<div class="vacio">Se necesita al menos una campaña con resultados.</div>`;
  const W=420,H=240,pl=48,pb=44,pt=22,pr=48,min=1,max=5,n=data.length,gap=n>1?(W-pl-pr)/(n-1):0;
  const x=i=>n>1?pl+gap*i:(W/2), y=v=>H-pb-((v-min)/(max-min))*(H-pb-pt);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:440px" role="img" aria-label="Evolución del promedio por campaña">`;
  for(let v=1;v<=5;v++){ g+=`<line x1="${pl}" y1="${y(v)}" x2="${W-pr}" y2="${y(v)}" stroke="#F1EFEA"/><text x="${pl-6}" y="${y(v)+3}" font-size="9" fill="#8A8377" text-anchor="end">${v.toFixed(1)}</text>`; }
  const pts=data.map((d,i)=>[x(i),y(d.v)]);
  if(n>1){ g+=`<path d="M ${pts[0][0]} ${y(min)} L ${pts.map(p=>p.join(" ")).join(" L ")} L ${pts[n-1][0]} ${y(min)} Z" fill="#B4890F" fill-opacity=".08"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#B4890F" stroke-width="2.5" stroke-linejoin="round"/>`; }
  data.forEach((d,i)=>{ g+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="${i===n-1?5:4}" fill="#B4890F" stroke="#fff" stroke-width="1.6"/><text x="${x(i)}" y="${y(d.v)-10}" font-size="10" font-weight="700" fill="#565049" text-anchor="middle">${d.v.toFixed(2)}</text><text x="${x(i)}" y="${H-pb+16}" font-size="9" fill="#8A8377" text-anchor="middle">${esc(corto(d.t))}</text>`; });
  return `<div style="display:flex;justify-content:center">${g+"</svg>"}</div>`;
}
// color del mapa de calor (0% = neutro, 100% = rojo)
function colorCalor(p){ if(p==null) return "background:#F5F4F2;color:#8A8377"; if(p<=0) return "background:#E7F6EC;color:#15803D";
  const t=Math.min(1,p/60); const r=Math.round(251-(251-220)*t), gg=Math.round(240-(240-38)*t), b=Math.round(216-(216-38)*t);
  return `background:rgb(${r},${gg},${b});color:${t>.55?"#fff":"#7A3E00"}`; }

function corto(t){ t=String(t).replace(/^Evaluaci[oó]n\s*(de desempe[nñ]o\s*)?(180°?)?\s*[—–-]?\s*/i,""); return t.length>20?t.slice(0,19)+"…":t; }

function donaSVG(dist){
  const tot=dist.reduce((s,x)=>s+x,0);
  if(!tot) return `<div class="vacio">Aún no hay resultados.</div>`;
  let a=-Math.PI/2; const cx=90,cy=90,R=72,r=48; let g=`<svg viewBox="0 0 180 180" width="190" height="190" role="img" aria-label="Distribución por nivel">`;
  const orden=[4,3,2,1,0];
  orden.forEach(i=>{ const v=dist[i]; if(!v) return; const f=v/tot; let a2=a+f*2*Math.PI; if(f>=1) a2=a+2*Math.PI-0.0001; const big=f>.5?1:0;
    const P=(ang,rad)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];
    const [x1,y1]=P(a,R),[x2,y2]=P(a2,R),[x3,y3]=P(a2,r),[x4,y4]=P(a,r);
    g+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z" fill="${NIVELES[i].color}" stroke="#fff" stroke-width="2.5"/>`; a=a2; });
  g+=`<text x="90" y="88" font-size="26" font-weight="800" fill="#16130E" text-anchor="middle">${tot}</text><text x="90" y="106" font-size="10.5" fill="#8A8377" text-anchor="middle">con resultado</text></svg>`;
  return `<div style="display:flex;flex-direction:column;align-items:center">${g}<div class="legend">${orden.map(i=>`<span><span class="swatch" style="background:${NIVELES[i].color}"></span>${NIVELES[i].txt} · ${dist[i]} (${Math.round(dist[i]*100/tot)}%)</span>`).join("")}</div></div>`;
}

    const m=$("cf-msg");
    if(parseFloat(vals.brecha_critica)<=parseFloat(vals.brecha_significativa)){ m.className="msg error"; m.textContent="La brecha crítica debe ser mayor que la significativa."; return; }
    const ts=["kpi_t5","kpi_t4","kpi_t3","kpi_t2"].map(k=>parseFloat(vals[k]));
    if(ts.some(isNaN)||!(ts[0]>ts[1]&&ts[1]>ts[2]&&ts[2]>ts[3]&&ts[3]>0)){ m.className="msg error"; m.textContent="Los umbrales del KPI deben ir de mayor a menor (nota 5 > nota 4 > nota 3 > nota 2 > 0)."; return; }
    const { error } = await sb.from("configuracion").upsert(Object.entries(vals).map(([clave,valor])=>({clave,valor:String(valor)})),{onConflict:"clave"});
    if(error){ m.className="msg error"; m.textContent="Error: "+error.message; return; }
    await cargarConfig(); m.className="msg ok"; m.textContent="✅ Reglas guardadas."; if($("cf-ktabla")) $("cf-ktabla").innerHTML=tablaConversionHTML(false);
  };
};


// ==================== ESTRUCTURA ORGANIZACIONAL (organigrama + puestos y competencias) ====================
const NIVELES_PUESTO=["Alta dirección","Gerencia","Jefatura / mando medio","Operativo","Apoyo"];
function etiquetaCritica(c){
  if(!c.critico) return "";
  return `<span class="tag-crit">CRÍTICA</span>${c.validada_por?`<span class="badge b-ok" style="margin-left:6px" title="Validada por ${esc(c.validada_por)}">✓ validada</span>`:`<span class="badge b-wait" style="margin-left:6px">por validar</span>`}`;
}
function fichaHTML(c, conEtiqueta=true){
  const p=[];
  if(c.politica) p.push(`<b>Política:</b> ${esc(c.politica)}`);
  if(c.indicador) p.push(`<b>Indicador:</b> ${esc(c.indicador)}`);
  if(c.meta) p.push(`<b>Meta:</b> ${esc(c.meta)}`);
  p.push(`<b>Nivel esperado:</b> ${esperadoDe(c).toFixed(1)}`);
  if(c.peso!=null&&c.peso!=="") p.push(`<b>Peso:</b> ${Number(c.peso)}%`);
  const falta=!c.politica||!c.indicador||!c.meta;
  return `<div class="ficha">${p.join(" · ")}${conEtiqueta?etiquetaCritica(c):""}${falta?' <span class="badge b-wait" style="margin-left:6px">Falta completar</span>':''}</div>`;
}
function camposCompHTML(c){
  c=c||{};
  return `<div class="fila"><div class="campo"><label>Competencia / categoría</label><input class="inp f-cat" value="${esc(c.categoria)}" placeholder="Ej. Gestión de nómina y pagos"></div>
      <div class="campo" style="flex:2"><label>Conducta a evaluar (enunciado)</label><input class="inp f-txt" value="${esc(c.texto)}" placeholder="Ej. Elabora roles y pagos sin errores y en calendario."></div></div>
    <div class="fila" style="margin-top:12px"><div class="campo" style="flex:2"><label>Política interna (regla que fija el estándar)</label>${D.v34&&D.politicas.length?`<select class="inp f-polid"><option value="">— Texto libre (sin política del catálogo) —</option>${D.politicas.filter(p=>p.estado!=="derogada"||p.id===c.politica_id).map(p=>`<option value="${p.id}" ${p.id===c.politica_id?"selected":""}>${esc((p.codigo?p.codigo+" · ":"")+p.nombre)}${p.estado!=="vigente"?" ("+p.estado+")":""}</option>`).join("")}</select>`:""}<input class="inp f-pol" value="${esc(c.politica)}" ${D.v34&&c.politica_id?"disabled":""} placeholder="${D.v34?"O escribe una regla propia":""}" style="${D.v34&&D.politicas.length?"margin-top:6px":""}"></div>
      <div class="campo" style="flex:2"><label>Indicador medible (qué se mide y cómo)</label><input class="inp f-ind" value="${esc(c.indicador)}"></div></div>
    <div class="fila" style="margin-top:12px"><div class="campo"><label>Meta</label><input class="inp f-meta" value="${esc(c.meta)}" placeholder="Ej. ≥98% · 0 multas · ≤2 días"><div class="sub-t f-meta-hint" style="margin-top:4px">${hintMeta(c.meta)}</div></div>
      <div class="campo"><label>Nivel esperado (1–5)</label><input class="inp f-min num" type="number" min="1" max="5" step="0.1" value="${esperadoDe(c)}"></div>
      <div class="campo"><label>¿Competencia crítica?</label><select class="inp f-crit"><option value="no">No (estándar)</option><option value="si" ${c.critico?"selected":""}>Sí (técnico-legal / seguridad)</option></select></div>
      <div class="campo" style="max-width:100px"><label>Orden</label><input class="inp f-ord num" type="number" value="${c.orden??0}"></div></div>
    <div class="fila" style="margin-top:12px"><div class="campo" style="flex:3"><label>Definición de la competencia (opcional)</label><input class="inp f-def" value="${esc(c.definicion)}" placeholder="Qué significa esta competencia en el puesto"></div>
      <div class="campo" style="max-width:150px"><label>Peso en el puesto (%)</label><input class="inp f-peso num" type="number" min="0" max="100" step="1" value="${c.peso??""}" placeholder="opcional"></div></div>
    <div class="fila f-val-wrap" style="margin-top:12px;${c.critico?"":"display:none"}"><div class="campo" style="flex:2"><label>Validada con (gerente del área)</label><input class="inp f-vp" value="${esc(c.validada_por)}" placeholder="Nombre y cargo del gerente"></div>
      <div class="campo"><label>Fecha de validación</label><input class="inp f-ve" type="date" value="${esc(c.validada_en)}"></div></div>`;
}
function leerComp(m){
  const v=parseFloat(m.querySelector(".f-min").value), crit=m.querySelector(".f-crit").value==="si";
  const o={ categoria:m.querySelector(".f-cat").value.trim(), texto:m.querySelector(".f-txt").value.trim(), politica:m.querySelector(".f-pol").value.trim()||null,
    indicador:m.querySelector(".f-ind").value.trim()||null, meta:m.querySelector(".f-meta").value.trim()||null,
    minimo:isNaN(v)?3.5:Math.min(5,Math.max(1,v)), critico:crit, orden:parseInt(m.querySelector(".f-ord").value)||0 };
  const sp=m.querySelector(".f-polid"); if(sp){ o.politica_id=sp.value?Number(sp.value):null; if(o.politica_id) o.politica=D.politicaPorId[o.politica_id]?.nombre||o.politica; }
  if(D.v32){ const ps=m.querySelector(".f-peso").value; o.definicion=m.querySelector(".f-def").value.trim()||null; o.peso=ps===""?null:Math.min(100,Math.max(0,parseFloat(ps))); o.nivel_esperado=o.minimo; }
  const vp=m.querySelector(".f-vp").value.trim(), ve=m.querySelector(".f-ve").value;
  if(crit||vp||ve){ o.validada_por=crit?(vp||null):null; o.validada_en=crit?(ve||null):null; }
  return o;
}
function hintMeta(meta){ if(!meta) return ""; const m=interpretarMeta(meta); return m?`✓ Se leerá como: ${esc(m.txt)}`:`<span style="color:var(--warn)">⚠ Sin un número la nota no se puede calcular desde el KPI (ej. «≥95%», «0 multas»)</span>`; }
function editarComp(c, puestoId, alTerminar){
  const ed=!!(c&&c.id);
  const pidF=(c&&c.puesto_id)||puestoId, funs=D.v35&&pidF?D.funciones.filter(f=>f.puesto_id===pidF).sort((a,b)=>(a.orden||0)-(b.orden||0)):[];
  const ya=ed?funcionesDeComp(c.id):new Set();
  abrirModal(`<h3>${ed?"Editar competencia":"Nueva competencia"}</h3><div style="color:var(--muted);font-size:12.5px;margin-bottom:14px">${ed&&c.puesto_id?esc(D.puestoPorId[c.puesto_id]?.nombre)+" · ":""}Conducta, política e indicador son tres cosas distintas. El nivel esperado es el estándar contra el que se calcula la brecha.</div>
    ${camposCompHTML(c)}
    ${funs.length?`<div class="lbl-campo" style="margin-top:12px">Funciones del puesto que respalda esta competencia</div><div style="max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px">${funs.map((f,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;margin:0;padding:4px 0;font-weight:500;font-size:13px"><input type="checkbox" class="ec-fn" value="${f.id}" ${ya.has(f.id)?"checked":""} style="margin-top:3px"> <span><b>${i+1}.</b> ${esc(f.funcion)}</span></label>`).join("")}</div>`:""}
    <div class="msg" id="ec-msg"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">${ed?`<button class="btn danger sm" id="ec-del" style="margin-right:auto">Eliminar</button>`:""}<button class="btn ghost sm" data-cerrar>Cancelar</button><button class="btn amber sm" id="ec-ok">Guardar</button></div>`, m=>{
    m.querySelector(".f-crit").onchange=e=>{ m.querySelector(".f-val-wrap").style.display=e.target.value==="si"?"":"none"; };
    m.querySelector(".f-meta").oninput=e=>{ m.querySelector(".f-meta-hint").innerHTML=hintMeta(e.target.value); };
    const sp=m.querySelector(".f-polid"); if(sp) sp.onchange=()=>{ const t=m.querySelector(".f-pol"), p=D.politicaPorId[Number(sp.value)]; t.disabled=!!p; if(p) t.value=p.nombre; };
    m.querySelector("#ec-ok").onclick=async()=>{
      const v=leerComp(m), msg=m.querySelector("#ec-msg");
      if(!v.categoria||!v.texto){ msg.className="msg error"; msg.textContent="Competencia y conducta son obligatorias."; return; }
      const r = ed ? await sb.from("competencias").update(v).eq("id",c.id) : await sb.from("competencias").insert({...v,puesto_id:puestoId}).select("id").single();
      if(r.error){ msg.className="msg error"; msg.textContent="Error: "+r.error.message; return; }
      if(funs.length){ const cid=ed?c.id:r.data.id; const marc=new Set([...m.querySelectorAll(".ec-fn:checked")].map(i=>Number(i.value)));
        const quitar=[...ya].filter(x=>!marc.has(x)), poner=[...marc].filter(x=>!ya.has(x));
        if(quitar.length) await sb.from("competencia_funcion").delete().eq("competencia_id",cid).in("funcion_id",quitar);
        if(poner.length) await sb.from("competencia_funcion").insert(poner.map(fid=>({competencia_id:cid,funcion_id:fid})));
      }
      cerrarModal(); await cargarBase(); alTerminar();
    };
    if(ed) m.querySelector("#ec-del").onclick=async()=>{ cerrarModal(); if(!await confirmar("Se eliminará la competencia y sus puntajes registrados.","Eliminar",true)) return; await sb.from("competencias").delete().eq("id",c.id); await cargarBase(); alTerminar(); };
  });
}
function validarCritica(c, alTerminar){

      <div class="campo"><label for="vc-f">Fecha</label><input class="inp" type="date" id="vc-f" value="${esc(c.validada_en||hoyISO())}"></div></div>
    <div class="msg" id="vc-msg"></div>

    m.querySelector("#vc-ok").onclick=async()=>{ const p=m.querySelector("#vc-p").value.trim(); if(!p){ m.querySelector("#vc-msg").className="msg error"; m.querySelector("#vc-msg").textContent="Escribe con quién se validó."; return; }
      const { error } = await sb.from("competencias").update({validada_por:p,validada_en:m.querySelector("#vc-f").value||hoyISO()}).eq("id",c.id);
      if(error){ m.querySelector("#vc-msg").className="msg error"; m.querySelector("#vc-msg").textContent=error.message; return; } cerrarModal(); await cargarBase(); alTerminar(); };
    m.querySelector("#vc-no").onclick=async()=>{ await sb.from("competencias").update({critico:false,validada_por:null,validada_en:null}).eq("id",c.id); cerrarModal(); await cargarBase(); alTerminar(); };
  });
}

    m.querySelector("#im-f").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ m.querySelector("#im-t").value+=(m.querySelector("#im-t").value?"\n":"")+r.result; }; r.readAsText(f); };
    m.querySelector("#im-ok").onclick=async()=>{
      const msg=m.querySelector("#im-msg"); let cat="General"; const ord={}; const filas=[];
      m.querySelector("#im-t").value.split("\n").forEach(l=>{ l=l.trim(); if(!l) return;
        if(!l.includes("|")){ cat=l; return; }
        const p=l.split("|").map(x=>x.trim()); if(p[0]) cat=p[0]; if(!p[1]) return;
        ord[cat]=(ord[cat]||0)+1;
        const f={puesto_id:puestoId,categoria:cat,texto:p[1],orden:ord[cat]};
        if(p[2]) f.politica=p[2]; if(p[3]) f.indicador=p[3]; if(p[4]) f.meta=p[4];
        if(p[5]&&!isNaN(parseFloat(p[5].replace(",",".")))) f.minimo=parseFloat(p[5].replace(",","."));

      cerrarModal(); await cargarBase(); alTerminar();
    };
  });
}

// Crea el catálogo a partir de los textos de política que ya existen en las competencias (sin duplicar)
async function migrarPoliticas(){
  const cand=D.competencias.filter(c=>!c.politica_id&&c.politica&&c.politica.trim());
  const grupos={}; cand.forEach(c=>{ const k=normTxt(c.politica); (grupos[k]=grupos[k]||{nombre:c.politica.trim(),comps:[]}).comps.push(c); });
  const existentes=Object.fromEntries(D.politicas.map(p=>[normTxt(p.nombre),p]));
  const nuevos=Object.entries(grupos).filter(([k])=>!existentes[k]);
  if(!await confirmar(`Se crearán <b>${nuevos.length}</b> políticas nuevas y se vincularán <b>${cand.length}</b> competencias. Las políticas que ya existen en el catálogo con el mismo nombre se reutilizan. Luego podrás completar el estándar, la versión y la aprobación de cada una.`,"Crear catálogo")) return;
  for(const [k,g] of Object.entries(grupos)){
    let pol=existentes[k];
    if(!pol){ const c0=g.comps[0]; const deps=[...new Set(g.comps.map(c=>c.puesto_id?D.puestoPorId[c.puesto_id]?.departamento:null))]; const dep=deps.length===1?deps[0]:null;
      D.politicas=D.politicas||[]; const cod=siguienteCodigo(dep);
      const { data, error } = await sb.from("politicas").insert({codigo:cod,nombre:g.nombre,departamento:dep||null,estandar:[c0.indicador,c0.meta].filter(Boolean).join(" · ")||null,estado:"vigente",origen:"migracion"}).select("*").single();
      if(error){ aviso("Error: "+esc(error.message)); return; } pol=data; D.politicas.push(data); }
    await sb.from("competencias").update({politica_id:pol.id}).in("id",g.comps.map(c=>c.id));
  }
  await cargarBase(); irA("politicas");
}

// Texto de un .docx (es un ZIP con word/document.xml). Respeta el orden de párrafos y tablas.
async function textoDocx(file){
  if(!window.XLSX||!XLSX.CFB) throw new Error("lector no disponible");
  const zip=XLSX.CFB.read(new Uint8Array(await file.arrayBuffer()),{type:"array"});
  const ent=XLSX.CFB.find(zip,"word/document.xml")||XLSX.CFB.find(zip,"/word/document.xml");
  if(!ent||!ent.content) throw new Error("no es un documento de Word válido");
  const xml=new TextDecoder("utf-8").decode(ent.content instanceof Uint8Array?ent.content:new Uint8Array(ent.content));
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const txtP=(p)=>{ let t=""; p.getElementsByTagNameNS(W,"*")&&[...p.getElementsByTagNameNS(W,"*")].forEach(n=>{ if(n.localName==="t") t+=n.textContent; else if(n.localName==="tab") t+="\t"; else if(n.localName==="br") t+="\n"; }); return t.trim(); };
  const body=doc.getElementsByTagNameNS(W,"body")[0]; if(!body) throw new Error("documento vacío");
  const out=[];
  [...body.children].forEach(el=>{
    if(el.localName==="p"){ const t=txtP(el); if(t) out.push(t); }
    else if(el.localName==="tbl"){ [...el.getElementsByTagNameNS(W,"tr")].forEach(tr=>{ const celdas=[...tr.children].filter(c=>c.localName==="tc").map(tc=>[...tc.getElementsByTagNameNS(W,"p")].map(txtP).filter(Boolean).join(" ")); if(celdas.some(Boolean)) out.push(celdas.join(" | ")); }); out.push(""); }
  });
  return out.join("\n").replace(/\n{3,}/g,"\n\n").slice(0,300000);
}
// Sube un archivo. Devuelve {ok, id} o {ok:false, motivo}
async function subirUno(f, pid, version, preguntarDuplicado){
  const esPdf=/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name), esDocx=/\.docx$/i.test(f.name);
  if(/\.doc$/i.test(f.name)) return {ok:false,motivo:"Word antiguo (.doc): guárdalo como .docx o PDF"};
  if(!esPdf&&!esDocx) return {ok:false,motivo:"solo PDF o Word .docx"};
  if(f.size>MAX_MANUAL_MB*1024*1024) return {ok:false,motivo:`pesa ${(f.size/1048576).toFixed(1)} MB (máx. ${MAX_MANUAL_MB})`};
  const hash=await hashArchivo(f);
  const { data:ig } = await sb.from("manuales_puesto").select("id,nombre_archivo").eq("hash_archivo",hash);
  if(ig&&ig.length&&!(preguntarDuplicado&&await preguntarDuplicado(ig[0]))) return {ok:false,motivo:`ya se subió antes como «${ig[0].nombre_archivo}»`,dup:true};
  let texto=null;   // Word: se extrae el texto aquí mismo (párrafos y tablas) para que la IA lo lea
  if(esDocx){ try{ texto=await textoDocx(f); }catch(e){ return {ok:false,motivo:"no se pudo leer el Word; guárdalo como PDF"}; }
    if(!texto||texto.length<200) return {ok:false,motivo:"el Word casi no tiene texto (¿escaneado?); súbelo como PDF"}; }
  const mime=esDocx?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":"application/pdf";
  const ruta=`${new Date().getFullYear()}/${hash.slice(0,16)}_${f.name.normalize("NFD").replace(/[^\w.\-]/g,"_").slice(-80)}`;
  const up=await sb.storage.from("manuales").upload(ruta,f,{contentType:mime,upsert:true});
  if(up.error) return {ok:false,motivo:"no se pudo subir: "+up.error.message};
  const { data, error } = await sb.from("manuales_puesto").insert({puesto_id:pid||null,nombre_archivo:f.name,version:version||null,estado:"cargado",archivo_path:ruta,hash_archivo:hash,mime_type:mime,texto_extraido:texto,tamano_bytes:f.size,subido_por:PERFIL.id}).select("id").single();
  if(error) return {ok:false,motivo:error.message};
  return {ok:true,id:data.id};
}

async function analizarLote(ids, noSubidos){
  const { data:mans } = await sb.from("manuales_puesto").select("id,nombre_archivo").in("id",ids);
  const nombre=(id)=>(mans||[]).find(x=>x.id===id)?.nombre_archivo||("Manual "+id);
  const est=Object.fromEntries(ids.map(id=>[id,["en espera","b-gris"]]));
  let cancelado=false;
  abrirModal(`<h3>✦ Analizando ${ids.length} manual${ids.length===1?"":"es"}</h3><div style="color:var(--muted);font-size:12.5px;margin-bottom:12px">La IA los lee uno por uno (30–120 s cada uno); si un proveedor está saturado, pasa solo al de respaldo. Puedes dejar esta ventana abierta; nada se aplica hasta que revises y apruebes.</div>
    ${noSubidos&&noSubidos.length?`<div class="explbox" style="margin:0 0 12px">⚠ No se subieron ${noSubidos.length}: ${noSubidos.map(e=>`<b>${esc(e[0])}</b> (${esc(e[1].replace(/^✕ /,""))})`).join(" · ")}</div>`:""}

    <div id="al-fin" style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn ghost sm" id="al-parar">Detener después del actual</button></div>`, m=>{ m.querySelector("#al-parar").onclick=()=>{ cancelado=true; m.querySelector("#al-parar").textContent="Se detendrá al terminar el actual…"; m.querySelector("#al-parar").disabled=true; }; });
  m_ancho(680);
  const pintar=(hechos)=>{ const t=$("al-lista"); if(!t) return; t.innerHTML=ids.map(id=>{ const e=est[id], err=e[1]==="b-red"; return `<tr><td style="min-width:200px;width:40%;word-break:break-word"><b>${esc(nombre(id))}</b></td><td class="r" style="white-space:normal">${err?`<div style="color:var(--red);font-size:12px;line-height:1.35;text-align:left">${esc(e[0])}</div>`:`<span class="badge ${e[1]}">${esc(e[0])}</span>`}</td></tr>`; }).join(""); if($("al-bar")) $("al-bar").style.width=Math.round(hechos*100/ids.length)+"%"; };
  let hechos=0, ok=0; pintar(0);
  for(const id of ids){
    if(cancelado){ est[id]=["no analizado","b-gris"]; continue; }
    est[id]=["analizando…","b-blue"]; pintar(hechos);
    let r=await sb.functions.invoke("analizar-manual",{ body:{ manual_id:id } }), t=r.error?await errorFuncion(r.error):"";
    if(r.error&&/429|quota|RESOURCE_EXHAUSTED|límite|saturad|tiempo/i.test(t)&&!/saldo|clave/i.test(t)){ est[id]=["IA ocupada: reintento en 60 s…","b-wait"]; pintar(hechos); await new Promise(z=>setTimeout(z,60000));
      r=await sb.functions.invoke("analizar-manual",{ body:{ manual_id:id } }); t=r.error?await errorFuncion(r.error):""; }
    if(r.error){ est[id]=["✕ "+t,"b-red"];
      if(/API_KEY|clave de IA|Failed to send|not found|404/i.test(t)){ ids.filter(x=>est[x][0]==="en espera").forEach(x=>est[x]=["no analizado","b-gris"]); hechos=ids.length; pintar(hechos); break; } }
    else { est[id]=["✓ borrador listo","b-ok"]; ok++; }

    const pintarChips=()=>{ const fs=lineasFun();

      const ps=pts.map(p=>Math.round(p*100/tot)); ps[ps.indexOf(Math.max(...ps))]+=100-ps.reduce((a,b)=>a+b,0);
      els.forEach((el,k)=>el.querySelector(".br-pe").value=ps[k]); refrescar(); };
    if(!soloVer){ m.addEventListener("input",refrescar); m.addEventListener("change",refrescar); }
    q("#br-dest").addEventListener("change",e=>{ const p=D.puestoPorId[Number(e.target.value)]; if(p){ q("#br-pn").value=p.nombre; if(!q("#br-dep").value) q("#br-dep").value=p.departamento||""; } });
    refrescar();

    const leer=()=>{ const nd={...d, puesto:q("#br-pn").value.trim(), departamento:q("#br-dep").value.trim(), nivel:q("#br-niv").value, mision:q("#br-mis").value.trim(),

      nd.competencias=[...m.querySelectorAll(".br-c")].map(el=>{ const c=d.competencias[Number(el.dataset.i)]; const g=s=>el.querySelector(s);
        return {...c, _excluir:!g(".br-inc").checked, nombre:g(".br-n").value.trim(), definicion:g(".br-de").value.trim(), conductas:g(".br-co").value.split("\n").map(x=>x.trim()).filter(Boolean),
          _pol:g(".br-po")?g(".br-po").value:undefined, politica:g(".br-pt")?g(".br-pt").value.trim():c.politica, indicador:g(".br-in").value.trim(), meta:g(".br-me").value.trim(),

          funciones_relacionadas:[...el.querySelectorAll(".br-fn:checked")].map(i=>Number(i.value)) }; });

    q("#br-guardar").onclick=async()=>{ const { error } = await sb.from("borradores_manual").update({datos:leer(),estado:"en_revision",revisado_por:PERFIL.id,revisado_en:new Date().toISOString()}).eq("id",b.id);
      if(error) return err(error.message); await sb.from("manuales_puesto").update({estado:"en_revision"}).eq("id",b.manual_id); cerrarModal(); modalManualesIA(); };
    if(q("#br-saltar")) q("#br-saltar").onclick=()=>{ const sig=cola[(pos+1)%cola.length]; if(sig&&sig!==b.id) revisarBorrador(sig); };
    q("#br-rech").onclick=async()=>{ const motivo=q("#br-msg"); motivo.className="msg"; motivo.innerHTML=`<input class="inp" id="br-mot" placeholder="Motivo del rechazo (opcional)"> <button class="btn danger xs" id="br-rok" style="margin-top:6px">Confirmar rechazo</button>`;
      q("#br-rok").onclick=async()=>{ await sb.from("borradores_manual").update({estado:"rechazado",comentario:q("#br-mot").value.trim()||null,revisado_por:PERFIL.id,revisado_en:new Date().toISOString()}).eq("id",b.id);
        await sb.from("manuales_puesto").update({estado:"rechazado"}).eq("id",b.manual_id); siguienteBorrador(b.id); }; };
    q("#br-ok").onclick=async()=>{ const nd=leer(); const inc=nd.competencias.filter(c=>!c._excluir);

      if(!inc.length) return err("Incluye al menos una competencia.");
      if(inc.some(c=>!c.nombre||!c.conductas.length)) return err("Cada competencia incluida necesita nombre y al menos una conducta.");
      const suma=Math.round(inc.reduce((a,c)=>a+c.peso,0)); if(suma!==100) return err(`Los pesos de las competencias incluidas suman ${suma}%; deben sumar 100%.`);
      const nombres=inc.map(c=>nrm(c.nombre)); if(new Set(nombres).size!==nombres.length) return err("Hay dos competencias con el mismo nombre en el borrador.");

        const resto=(await borradoresPendientes()).filter(x=>x!==b.id);
        abrirModal(`<p style="margin-bottom:16px">`+`✅ Manual aplicado a <b>${esc(nd.puesto)}</b>: ${res.fn} funciones, ${res.nuevas} competencias nuevas, ${res.act} actualizadas${res.enlaces?`, ${res.enlaces} vínculos competencia–función`:""}${res.pols?`, ${res.pols} políticas creadas (quedan como «sin aprobación registrada» en Políticas)`:""}.${res.fuera.length?`<br><br>⚠ El puesto tiene ${res.fuera.length} competencia(s) que el manual no menciona: <b>${res.fuera.map(esc).join(", ")}</b>. No se borraron; revisa si siguen aplicando y ajusta los pesos.`:""}`+`</p><div style="display:flex;gap:8px;justify-content:flex-end">${resto.length?`<button class="btn ghost sm" data-cerrar>Ver el puesto</button><button class="btn amber sm" id="br-sig">Siguiente borrador (${resto.length})</button>`:`<button class="btn sm" data-cerrar>Entendido</button>`}</div>`, mm=>{ if(mm.querySelector("#br-sig")) mm.querySelector("#br-sig").onclick=()=>revisarBorrador(resto[0]); }); }
      catch(e){ q("#br-ok").disabled=false; q("#br-ok").textContent="Aprobar y aplicar"; err("Se detuvo: "+(e.message||e)+". Revisa la estructura antes de reintentar."); }
    };
  });
  m_ancho(820);
}

// ---------- Aplicar (solo con aprobación de RRHH) ----------
async function aplicarBorrador(b, d){
  const ok=(r)=>{ if(r.error) throw new Error(r.error.message); return r.data; };
  const hoy=hoyISO(), inc=d.competencias.filter(c=>!c._excluir);
  // 1. Puesto
  const vP={nombre:d.puesto, departamento:d.departamento||null, nivel:d.nivel||null, mision:d.mision||null, reporta_a:d._reporta_a_id?Number(d._reporta_a_id):null};
  let puestoId=d._destino?Number(d._destino):null;
  if(puestoId){ const ant=D.puestoPorId[puestoId]; const upd={};
    Object.entries(vP).forEach(([k,v])=>{ if(v!=null&&v!=="") upd[k]=v; }); if(upd.reporta_a===puestoId) delete upd.reporta_a;
    if(ant&&upd.nombre&&ant.nombre!==upd.nombre) ok(await sb.from("perfiles").update({puesto:upd.nombre}).eq("puesto",ant.nombre));
    ok(await sb.from("puestos").update(upd).eq("id",puestoId)); }
  else puestoId=ok(await sb.from("puestos").insert(vP).select("id").single()).id;
  // 2. Funciones
  let actuales=D.funciones.filter(f=>f.puesto_id===puestoId);
  if(d._reemplazar&&actuales.length){ ok(await sb.from("funciones_puesto").delete().eq("puesto_id",puestoId)); actuales=[]; }
  const ya=new Set(actuales.map(f=>nrm(f.funcion))); let orden=Math.max(0,...actuales.map(f=>f.orden||0));
  const nuevasF=d.funciones.filter(f=>!ya.has(nrm(f))).map(f=>({puesto_id:puestoId,funcion:f,orden:++orden,origen:"ia_aprobada",manual_id:b.manual_id}));
  const insF=nuevasF.length?ok(await sb.from("funciones_puesto").insert(nuevasF).select("id,funcion")):[];
  // número de función del borrador (1, 2, 3…) → id real, para enlazar competencias con funciones
  const idPorTexto={}; actuales.forEach(f=>idPorTexto[nrm(f.funcion)]=f.id); (insF||[]).forEach(f=>idPorTexto[nrm(f.funcion)]=f.id);
  const idFuncion=(n)=>idPorTexto[nrm(d.funciones[n-1]||"")];
  let enlaces=0;
  // 3. Políticas nuevas (solo si el catálogo existe)
  let pols=0; const polCreada={};
  for(const c of inc){ if(!D.v34||c._pol!=="nueva"||!c.politica) continue; const k=nrm(c.politica);
    if(polCreada[k]){ c._polId=polCreada[k]; continue; }
    const ex=D.politicas.find(p=>nrm(p.nombre)===k); if(ex){ c._polId=ex.id; continue; }
    const r=ok(await sb.from("politicas").insert({codigo:siguienteCodigo(d.departamento),nombre:c.politica,departamento:d.departamento||null,estandar:[c.indicador,c.meta].filter(Boolean).join(" · ")||null,documento_ref:"Manual de funciones",estado:"vigente",origen:"ia_aprobada"}).select("*").single());
    D.politicas.push(r); polCreada[k]=r.id; c._polId=r.id; pols++; }
  // 4. Competencias y conductas
  const ex=D.competencias.filter(c=>c.puesto_id===puestoId); let nuevas=0, act=0, ordC=Math.max(0,...ex.map(c=>c.orden||0));
  for(const c of inc){
    const polId=c._polId||(c._pol&&c._pol!=="nueva"?Number(c._pol):null);
    const polTxt=polId?(D.politicaPorId?.[polId]?.nombre||D.politicas.find(p=>p.id===polId)?.nombre):(D.v34?(c._pol===""?null:c.politica):c.politica)||null;
    const v={categoria:c.nombre, texto:c.conductas[0], definicion:c.definicion||null, indicador:c.indicador||null, meta:c.meta||null, minimo:c.nivel_esperado, nivel_esperado:c.nivel_esperado, peso:c.peso, critico:!!c.critico, politica:polTxt};
    if(D.v34) v.politica_id=polId||null;
    if(c.critico){ v.validada_por=`${PERFIL.nombre} (aprobación de manual)`; v.validada_en=hoy; }
    const e=ex.find(x=>nrm(x.nombre||x.categoria)===nrm(c.nombre)||nrm(x.categoria)===nrm(c.nombre));
    let compId;
    if(e){ ok(await sb.from("competencias").update(v).eq("id",e.id)); compId=e.id; act++; }
    else { compId=ok(await sb.from("competencias").insert({...v,nombre:c.nombre,puesto_id:puestoId,orden:++ordC,origen:"ia_aprobada",manual_id:b.manual_id}).select("id").single()).id; nuevas++; }
    // conductas adicionales (la primera ya es el texto de la competencia)
    if(D.v35){ const fids=[...new Set((c.funciones_relacionadas||[]).map(idFuncion).filter(Boolean))];
      ok(await sb.from("competencia_funcion").delete().eq("competencia_id",compId));
      if(fids.length){ ok(await sb.from("competencia_funcion").insert(fids.map(fid=>({competencia_id:compId,funcion_id:fid,origen:"ia_aprobada"})))); enlaces+=fids.length; } }
    const extra=c.conductas.slice(1); if(extra.length){ const tiene=new Set(D.conductas.filter(k=>k.competencia_id===compId).map(k=>nrm(k.texto)));
      const filas=extra.filter(t=>!tiene.has(nrm(t))).map((t,i)=>({competencia_id:compId,texto:t,politica:polTxt,indicador:c.indicador||null,meta:c.meta||null,orden:i+2,origen:"ia_aprobada",sincronizada:false}));
      if(filas.length) ok(await sb.from("conductas_competencia").insert(filas)); }
  }
  // 5. Cierre: borrador aplicado + manual aprobado (queda en bitácora)
  const ahora=new Date().toISOString();
  ok(await sb.from("borradores_manual").update({datos:d,estado:"aplicado",puesto_id:puestoId,revisado_por:PERFIL.id,revisado_en:ahora,aprobado_por:PERFIL.id,aprobado_en:ahora}).eq("id",b.id));
  ok(await sb.from("manuales_puesto").update({estado:"aprobado",puesto_id:puestoId}).eq("id",b.manual_id));
  const tocadas=new Set(inc.map(c=>nrm(c.nombre)));
  const fuera=ex.filter(x=>!tocadas.has(nrm(x.nombre||x.categoria))&&!tocadas.has(nrm(x.categoria))).map(x=>x.categoria);
  return {puestoId, fn:nuevasF.length, nuevas, act, pols, fuera, enlaces};
}

// ---- Carga masiva (Excel) con organigrama ----
function mapFila(row){
  const o={}; for(const k in row){ const n=normTxt(k);
    if(n.startsWith("nombre")) o.nombres=row[k]; else if(n.startsWith("apellido")) o.apellidos=row[k];
    else if(n.startsWith("cedula")||n==="ci") o.cedula=row[k]; else if(n.startsWith("depart")||n.startsWith("area")) o.departamento=row[k];
    else if(n.startsWith("puesto")||n.startsWith("cargo")) o.puesto=row[k]; else if(n.startsWith("rol")) o.rol=row[k];
    else if(n.startsWith("correo")||n.startsWith("email")) o.correo=row[k]; else if(n.startsWith("jefe")) o.jefe=row[k]; else if(n.startsWith("usuario")) o.usuario=row[k]; }
  return o;
}
const normCedula=(c)=>{ c=(c==null?"":String(c)).replace(/\D/g,""); if(c.length===9) c="0"+c; return c; };
function cargaMasiva(){
  abrirModal(`<h3>Carga masiva de usuarios</h3><div style="color:var(--muted);font-size:12.5px;margin:4px 0 12px">Excel con columnas <b>Nombres, Apellidos, Cedula, Departamento, Puesto, Rol, Correo, Jefe</b>. En <b>Jefe</b> pon la cédula o el usuario del jefe directo. Se crean las personas y luego se enlaza el organigrama. Los que ya existen se actualizan (puesto, departamento, jefe).</div>
    <input type="file" id="cm-f" accept=".xlsx,.xls,.csv" style="font-size:13px"> <button class="btn ghost sm" id="cm-prev">Vista previa</button>
    <div id="cm-out" style="margin-top:12px"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn ghost sm" data-cerrar>Cerrar</button></div>`, m=>{
    m.querySelector("#cm-prev").onclick=async()=>{
      const out=m.querySelector("#cm-out"), f=m.querySelector("#cm-f").files[0];
      if(!f){ out.innerHTML=`<div class="msg error">Elige un archivo.</div>`; return; }
      const filas=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>{ try{ const wb=XLSX.read(e.target.result,{type:"binary"}); res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:false})); }catch(err){rej(err);} }; r.readAsBinaryString(f); }).catch(err=>{ out.innerHTML=`<div class="msg error">No pude leer el archivo: ${esc(err.message)}</div>`; return null; });
      if(!filas) return;
      const usados=new Set(D.perfiles.map(p=>p.usuario)); const porCed=Object.fromEntries(D.perfiles.filter(p=>p.cedula).map(p=>[p.cedula,p]));
      const lista=filas.map(mapFila).filter(o=>o.nombres||o.apellidos).map(o=>{
        const nombre=((o.nombres||"")+" "+(o.apellidos||"")).trim().replace(/\s+/g," "), cedula=normCedula(o.cedula);
        const existe=porCed[cedula];
        let usuario=existe?existe.usuario:(o.usuario?soloAlnum(o.usuario):null);
        if(!usuario){ const n=soloAlnum((o.nombres||"").split(/\s+/)[0]), a=soloAlnum((o.apellidos||"").split(/\s+/)[0]); let b=(n[0]||"")+a||"usuario", u=b, i=1; while(usados.has(u)){i++;u=b+i;} usuario=u; }
        usados.add(usuario);
        return { nombre, cedula, usuario, existe, rol:normTxt(o.rol).startsWith("evaluador")?"evaluador":"evaluado", correo:String(o.correo||"").trim()||null,
          departamento:String(o.departamento||"").trim()||null, puesto:String(o.puesto||"").trim()||null, jefe:String(o.jefe||"").trim() };
      });
      const sinCed=lista.filter(r=>r.cedula.length<6).length;
      out.innerHTML=`<div class="aviso">${lista.filter(r=>!r.existe).length} nuevos · ${lista.filter(r=>r.existe).length} existentes se actualizan${sinCed?` · <b style="color:var(--red)">${sinCed} sin cédula válida (se omiten)</b>`:""}</div>
        <div class="tabla-wrap" style="max-height:260px;overflow:auto"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Puesto</th><th>Jefe</th><th></th></tr></thead><tbody>${lista.slice(0,80).map(r=>`<tr><td>${esc(r.nombre)}</td><td>${esc(r.usuario)}</td><td>${esc(r.puesto)||"—"}</td><td>${esc(r.jefe)||"—"}</td><td>${r.existe?'<span class="badge b-gris">existe</span>':'<span class="badge b-ok">nuevo</span>'}</td></tr>`).join("")}</tbody></table></div>
        <button class="btn amber sm" id="cm-ok" style="margin-top:12px">Procesar ${lista.length} filas</button><div class="msg" id="cm-msg"></div>`;
      m.querySelector("#cm-ok").onclick=async()=>{
        const b=m.querySelector("#cm-ok"), msg=m.querySelector("#cm-msg"); b.disabled=true; let ok=0,act=0; const errores=[];
        for(let i=0;i<lista.length;i++){ const r=lista[i]; msg.className="msg"; msg.textContent=`Procesando ${i+1} de ${lista.length}...`;
          if(r.cedula.length<6){ errores.push(`${r.nombre}: cédula inválida`); continue; }
          const datos={nombre:r.nombre,cedula:r.cedula,rol:r.rol,correo:r.correo,departamento:r.departamento,puesto:r.puesto};
          if(r.existe){ await sb.from("perfiles").update(datos).eq("id",r.existe.id); act++; continue; }
          const { data, error } = await sbTmp.auth.signUp({ email:usuarioAEmail(r.usuario), password:r.cedula });
          if(error){ errores.push(`${r.usuario}: ${error.message}`); if(/rate|too many/i.test(error.message)) await sleep(3000); continue; }
          const { error:e2 } = await sb.from("perfiles").insert({ id:data.user.id, usuario:r.usuario, ...datos });
          if(e2) errores.push(`${r.usuario}: ${e2.message}`); else { ok++; await sb.from("accesos_temp").insert({ perfil_id:data.user.id, usuario:r.usuario, clave:r.cedula }); }
          await sleep(150);
        }
        await cargarBase();
        // Enlazar organigrama
        const porCed2=Object.fromEntries(D.perfiles.filter(p=>p.cedula).map(p=>[p.cedula,p])), porUsu=Object.fromEntries(D.perfiles.map(p=>[p.usuario,p]));
        let enl=0; for(const r of lista){ if(!r.jefe) continue; const j=porCed2[normCedula(r.jefe)]||porUsu[soloAlnum(r.jefe)]; const yo=porCed2[r.cedula];
          if(j&&yo&&j.id!==yo.id){ await sb.from("perfiles").update({jefe_id:j.id}).eq("id",yo.id); enl++; } else errores.push(`${r.nombre}: no encontré al jefe "${r.jefe}"`); }
        await cargarBase();
        msg.className="msg ok"; msg.innerHTML=`✅ Creados: <b>${ok}</b> · Actualizados: <b>${act}</b> · Jefes enlazados: <b>${enl}</b>. La contraseña inicial de los nuevos es su cédula.${errores.length?`<div style="max-height:120px;overflow:auto;color:var(--red);font-size:12px;margin-top:6px">${errores.slice(0,100).map(esc).join("<br>")}</div>`:""}`;
      };
    };
  });
  const cerrarYRecargar=()=>irA("usuarios");
  $("modal-root").querySelector("[data-cerrar]").addEventListener("click",cerrarYRecargar);
}

  };
  $("ev-est").onchange=pintar; $("ev-q").oninput=pintar; pintar();

    const ya=await cargarEvaluaciones(p); const clave=new Set(ya.map(e=>e.evaluado_id+"|"+e.tipo));
    const filas=[]; const sinPuesto=[];
    conJefe.filter(x=>!dep||x.departamento===dep).forEach(x=>{
      const pu=D.puestos.find(z=>z.nombre===x.puesto); if(!pu){ sinPuesto.push(x.nombre); return; }

    });
    if(!filas.length){ msg.className="msg"; msg.textContent="No hay evaluaciones nuevas por crear."+(sinPuesto.length?` ${sinPuesto.length} personas no tienen un puesto registrado.`:""); return; }
    if(!await confirmar(`Se crearán <b>${filas.length}</b> evaluaciones en la campaña.${sinPuesto.length?`<br><span style="color:var(--warn)">${sinPuesto.length} personas se omiten porque su puesto no está registrado en Puestos.</span>`:""}`,"Generar")) return;
    $("gc-ok").disabled=true; msg.className="msg"; msg.textContent="Creando...";
    for(let i=0;i<filas.length;i+=500){ const { error } = await sb.from("evaluaciones").insert(filas.slice(i,i+500)); if(error){ msg.className="msg error"; msg.textContent="Error: "+error.message; $("gc-ok").disabled=false; return; } }
    irA("evaluaciones",p);
  };
  $("ai-ok").onclick=async()=>{
    const msg=$("ai-msg"), tipo=$("ai-tipo").value, evdo=$("ai-evdo").value, evdr=tipo==="autoevaluacion"?evdo:$("ai-evdr").value, pue=$("ai-pue").value, p=$("ai-per").value;
    if(!evdo||!evdr||!pue||!p){ msg.className="msg error"; msg.textContent="Completa campaña, evaluado, evaluador y puesto."; return; }
    if(tipo==="evaluador"&&evdo===evdr){ msg.className="msg error"; msg.textContent="El evaluador debe ser distinto del evaluado."; return; }
    const { error } = await sb.from("evaluaciones").insert({evaluado_id:evdo,evaluador_id:evdr,puesto_id:Number(pue),periodo_id:Number(p),tipo});
    if(error){ msg.className="msg error"; msg.textContent="Error: "+error.message; return; }
    irA("evaluaciones",p);
  };
};

async function generarPlanes(personas){
  if(!D.acciones.length){ const { data } = await sb.from("acciones").select("*"); D.acciones=data||[]; }
  if(!D.acciones.length){ await sb.from("acciones").insert(BIBLIOTECA_BASE); const { data } = await sb.from("acciones").select("*"); D.acciones=data||[]; }
  const pid=personas[0]?.periodo_id; if(!pid) return 0;
  const existentes=await traerTodo(()=>sb.from("planes").select("id,evaluado_id,competencia_id,competencia,departamento,tipo,estado").eq("periodo_id",pid));
  const ya=new Set(existentes.filter(p=>p.evaluado_id).map(p=>p.evaluado_id+"|"+p.competencia_id));
  const grupales=existentes.filter(p=>p.tipo==="grupal");
  const filas=[];
  personas.forEach(x=>x.filas.forEach(f=>{
    if(f.nb.i<2||ya.has(x.id+"|"+f.c.id)) return;
    const a=accionSugerida(f.c,f.nb.i), crit=f.nb.i===3;
    const enGrupo=grupales.some(g=>normTxt(g.competencia)===normTxt(f.c.categoria)&&(!g.departamento||g.departamento===x.departamento));
    filas.push({ periodo_id:pid, evaluado_id:x.id, competencia_id:f.c.id, competencia:f.c.categoria, departamento:x.departamento,
      tipo:crit?"pdi":"desarrollo", brecha:f.bd, accion:a?a.accion:"Definir con el jefe inmediato una acción concreta dentro de las tareas habituales del puesto.",
      indicador:(a&&a.indicador)||f.c.indicador||null, fecha_seguimiento:sumarDias(hoyISO(),a?.dias||(crit?90:60)), estado:enGrupo?"grupal":"propuesto" });
  }));
  for(let i=0;i<filas.length;i+=500){ const { error } = await sb.from("planes").insert(filas.slice(i,i+500)); if(error) throw error; }
  return filas.length;
}

  document.querySelectorAll("[data-grp]").forEach(b=>b.onclick=()=>modalProgramaGrupal(colectivas[Number(b.dataset.grp)],pid,ind,recargar));

  const editarAccion=(a)=>abrirModal(`<h3>${a?"Editar acción":"Nueva acción"}</h3>
    <div class="fila" style="margin-top:10px"><div class="campo"><label for="ba-c">Competencia (palabra clave)</label><input class="inp" id="ba-c" value="${esc(a?.competencia)}" list="ba-l" placeholder="Ej. Comunicación"><datalist id="ba-l">${grupos.map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
      <div class="campo"><label for="ba-n">Para brecha</label><select class="inp" id="ba-n">${opciones([["significativa","Significativa"],["critica","Crítica"]],a?.nivel||"significativa")}</select></div><div class="campo" style="max-width:120px"><label for="ba-d">Días</label><input class="inp num" type="number" id="ba-d" value="${a?.dias||60}"></div></div>
    <div class="campo" style="margin-top:12px"><label for="ba-a">Acción</label><textarea class="inp" id="ba-a" rows="3">${esc(a?.accion)}</textarea></div>
    <div class="campo"><label for="ba-i">Indicador</label><input class="inp" id="ba-i" value="${esc(a?.indicador)}"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">${a?`<button class="btn danger sm" id="ba-del" style="margin-right:auto">Eliminar</button>`:""}<button class="btn ghost sm" data-cerrar>Cancelar</button><button class="btn amber sm" id="ba-ok">Guardar</button></div>`, m=>{
    m.querySelector("#ba-ok").onclick=async()=>{ const v={competencia:m.querySelector("#ba-c").value.trim(),nivel:m.querySelector("#ba-n").value,dias:parseInt(m.querySelector("#ba-d").value)||60,accion:m.querySelector("#ba-a").value.trim(),indicador:m.querySelector("#ba-i").value.trim()||null};
      if(!v.competencia||!v.accion) return; a?await sb.from("acciones").update(v).eq("id",a.id):await sb.from("acciones").insert(v); cerrarModal(); recargar(); };

  document.querySelectorAll("[data-bi]").forEach(b=>b.onclick=()=>editarAccion(acc.find(a=>a.id===Number(b.dataset.bi))));
